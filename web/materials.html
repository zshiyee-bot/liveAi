<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素材库 · LiveTalking</title>
<style>
/* ══════════════════════════════════════════════════════════════
   设计令牌
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f5f7;
  --bg-elev:#ffffff;
  --sidebar:rgba(255,255,255,.86);
  --card:#ffffff;
  --line:#e9eaf0;
  --line-2:#f1f2f6;
  --ink:#111827;
  --ink-2:#5b6474;
  --ink-3:#7a8393;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --accent-soft:#eef0fe;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  --ok:#10b981; --ok-soft:#e7f8f1;
  --warn:#f59e0b; --warn-soft:#fef4e3;
  --bad:#ef4444;  --bad-soft:#fdeceb;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 4px 12px -2px rgba(16,24,40,.08), 0 2px 6px -2px rgba(16,24,40,.05);
  --sh-3:0 18px 36px -12px rgba(16,24,40,.20), 0 8px 16px -8px rgba(16,24,40,.10);
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  display:flex;height:100vh;-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv02","cv03","cv04","cv11";
}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd3dc;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aeb4c0;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ══════════════ 侧边栏 ══════════════ */
.side{
  width:268px;flex:0 0 268px;display:flex;flex-direction:column;
  background:var(--sidebar);backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid var(--line);z-index:20;
}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand .logo{
  width:36px;height:36px;border-radius:11px;background:var(--grad);flex:0 0 36px;
  display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(99,102,241,.55);
}
.brand .logo svg{width:19px;height:19px;fill:#fff}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);font-weight:500}
.side-scroll{flex:1;overflow-y:auto;padding:0 12px 16px;min-height:0}
.sec{
  font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;
  padding:14px 10px 7px;text-transform:uppercase;
}
.nitem{
  display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;border-radius:var(--r-md);
  cursor:default;user-select:none;color:var(--ink-2);position:relative;
  transition:background .12s var(--ease),color .12s var(--ease);
}
.nitem:hover{background:#f1f2f6;color:var(--ink)}
.nitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nitem.on::before{
  content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
  background:var(--grad);border-radius:0 3px 3px 0;
}
.nitem .chev{
  width:16px;flex:0 0 16px;display:grid;place-items:center;color:var(--ink-3);
  font-size:9px;border-radius:4px;height:16px;transition:background .12s;
}
.nitem .chev:hover{background:#e5e7eb;color:var(--ink)}
.nitem .ico{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center}
.nitem .ico svg{width:17px;height:17px}
.nitem .ico.dot::after{
  content:'';width:9px;height:9px;border-radius:3px;background:#ced2db;
  transition:background .14s var(--ease),box-shadow .14s var(--ease);
}
.nitem .ico.dot.has::after{
  background:var(--accent);
  box-shadow:0 0 0 3px rgba(99,102,241,.16);
}
.nitem.on .ico.dot::after{background:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.nitem .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nitem .cnt{
  font-size:11px;font-weight:600;color:var(--ink-3);background:#f1f2f6;
  border-radius:99px;padding:1px 7px;flex:0 0 auto;line-height:1.5;
}
.nitem.on .cnt{background:#fff;color:var(--accent)}
.nitem .cnt.warn{background:#fdf1de;color:#8d6417}
.nitem .cnt.ok{background:#f1f2f6;color:var(--ink-3)}
.nitem .cnt.live{background:#eaf7f1;color:#2f7f63}
.nitem .cnt.live::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--ok);margin-right:4px;vertical-align:middle;animation:pulse 1.6s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sub{padding-left:22px}
.sub .nitem{height:32px}
.sub .nitem .lb{font-size:12.5px}

/* ══════════════ 主区 ══════════════ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:64px;flex:0 0 64px;display:flex;align-items:center;gap:10px;padding:0 22px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);z-index:15;
}
.search{
  position:relative;width:min(340px,36vw);flex:0 1 340px;
}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.search input{
  width:100%;height:38px;border:1px solid transparent;background:#f1f2f6;border-radius:99px;
  padding:0 34px 0 34px;font-size:13px;color:var(--ink);outline:none;
  transition:background .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease);
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{background:#fff;border-color:#d9dce6;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.search .clr{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  border-radius:50%;background:#d5d8e0;color:#fff;border:0;font-size:11px;line-height:1;
  cursor:pointer;display:none;place-items:center;padding:0;
}
.search.has .clr{display:grid}
.spacer{flex:1}
.seg{display:flex;background:#f1f2f6;border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;height:30px;padding:0 11px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px;font-weight:500;
  transition:background .14s var(--ease),color .14s var(--ease),box-shadow .14s var(--ease);
}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1);font-weight:600}
.sel-wrap{position:relative}
select.sel{
  height:38px;appearance:none;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);
  padding:0 30px 0 12px;font-size:13px;color:var(--ink);cursor:pointer;outline:none;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease);
}
select.sel:hover{border-color:#d9dce6}
select.sel:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.sel-wrap::after{
  content:'';position:absolute;right:12px;top:50%;width:7px;height:7px;pointer-events:none;
  border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
  transform:translateY(-70%) rotate(45deg);
}
.btn{
  height:38px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:transform .12s var(--ease),box-shadow .15s var(--ease),background .14s var(--ease),border-color .14s var(--ease);
  white-space:nowrap;
}
.btn svg{width:16px;height:16px;flex:0 0 16px}
.btn:hover{background:#fbfbfd;border-color:#d9dce6;box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px rgba(99,102,241,.6)}
.btn.pri:hover{box-shadow:0 10px 24px -6px rgba(99,102,241,.7);background:var(--grad)}
.btn.dan{color:var(--bad);border-color:#f6d5d3}
.btn.dan:hover{background:var(--bad-soft);border-color:#f0b6b3}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.btn.icon{padding:0;width:38px;justify-content:center}
.menu-wrap{position:relative}
.menu{
  position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--sh-3);padding:6px;min-width:216px;display:none;z-index:60;
}
.menu.on{display:block;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu .mi{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:default;font-size:13px;
  color:var(--ink);
}
.menu .mi:hover{background:#f4f5f7}
.menu .mi .k{margin-left:auto;color:var(--ink-3);font-size:11.5px}

/* ══════════════ 面包屑 ══════════════ */
.crumb{
  display:flex;align-items:center;gap:2px;padding:16px 22px 10px;flex:0 0 auto;flex-wrap:wrap;
}
.crumb .seg2{
  padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);
  transition:background .12s,color .12s;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.crumb .seg2:hover{background:#eaecef;color:var(--ink)}
.crumb .seg2.last{color:var(--ink);font-weight:700;cursor:default}
.crumb .seg2.last:hover{background:transparent}
.crumb .sep{color:#c9cdd6;font-size:15px;user-select:none}
.crumb .meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}

/* 混模型告警条（库内同时有 wav2lip 与 musetalk 片段时出现） */
.kindwarn{
  display:flex;gap:10px;align-items:flex-start;margin:0 22px 6px;padding:11px 14px;
  background:#fffbeb;border:1px solid #fde68a;border-radius:12px;
  color:#92400e;font-size:13px;line-height:1.65;flex:0 0 auto;
}
.kindwarn b{color:#78350f}

/* 模型类型 chip：wav2lip 用蓝、musetalk 用紫，便于一眼区分 */
.chip.k.w{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}
.chip.k.m{background:#f3e8ff;color:#6b21a8;border-color:#e9d5ff}
/* 侧栏片段行的模型小标 */
.kt{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;flex:0 0 auto;letter-spacing:.2px}
.kt.w{background:#e0e7ff;color:#3730a3}
.kt.m{background:#f3e8ff;color:#6b21a8}

/* 对话框里的单选卡片（新建库/训练时选模型） */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:block;position:relative;padding:11px 13px 11px 38px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);cursor:pointer;background:#fff;transition:border-color .14s,background .14s;
}
.opt:hover{border-color:#c7cbd6;background:#fafbfc}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{position:absolute;left:13px;top:13px;margin:0;accent-color:var(--accent)}
.opt .ot{display:block;font-size:13.5px;font-weight:650;color:var(--ink)}
.opt .od{display:block;font-size:12px;color:#6b7484;margin-top:3px;line-height:1.62}
.opt.on .ot{color:var(--accent)}

/* 顶部"已选 N 项"标签 */
#selCount{
  display:none;align-items:center;font-size:12px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:99px;padding:2px 10px;
}

/* 侧栏行的悬停操作按钮（重命名 / 删除）—— 之前只能右键卡片，不好发现 */
.nitem .hops{display:none;gap:2px;flex:0 0 auto;margin-left:6px}
.nitem:hover .hops{display:flex}
.nitem:hover .cnt{display:none}          /* 悬停时用操作按钮占位，避免行宽跳动 */
.hbtn{
  width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:#7b8494;cursor:pointer;transition:background .12s,color .12s;
}
.hbtn svg{width:13px;height:13px}
.hbtn:hover{background:#e8eaef;color:#2b3445}
.hbtn.del:hover{background:#fee2e2;color:#dc2626}

/* ══════════════ 内容区 ══════════════ */
.content{flex:1;overflow-y:auto;padding:4px 22px 40px;min-height:0;position:relative}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));
  gap:18px;align-content:start;align-items:start;
}
.grid.list{display:flex;flex-direction:column;gap:6px}

/* ── 卡片 ── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  cursor:default;user-select:none;position:relative;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
  animation:rise .28s var(--ease) backwards;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:#dfe2ea}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16), var(--sh-2)}
.card.sel:hover{box-shadow:0 0 0 3px rgba(99,102,241,.20), var(--sh-3)}

/* 媒体区：模糊铺底 + 居中原始比例图（任何画幅都不变形） */
.media{
  position:relative;aspect-ratio:4/3;background:#1b1f2a;overflow:hidden;
}
.media .cover{
  position:absolute;inset:-16%;width:132%;height:132%;object-fit:cover;
  filter:blur(34px) saturate(1.3);opacity:.62;transform:scale(1.1);
}
.media .shot{
  position:absolute;inset:0;margin:auto;max-width:calc(100% - 26px);max-height:calc(100% - 26px);
  object-fit:contain;border-radius:10px;box-shadow:0 10px 26px -6px rgba(0,0,0,.55);
  background:#0e1015;
}
.media.grad{background:var(--grad);display:grid;place-items:center}
.media.grad .glyph{width:62px;height:62px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.28));opacity:.97}
.tag{
  position:absolute;top:10px;left:10px;height:22px;padding:0 9px;border-radius:99px;
  background:rgba(255,255,255,.92);color:#2b3242;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(0,0,0,.18);letter-spacing:.01em;
}
.tag.muse{background:rgba(139,92,246,.92);color:#fff}
.tag.wav{background:rgba(99,102,241,.92);color:#fff}
.tag.ready{background:rgba(255,255,255,.93);color:#2b3242}
.tag.wait{background:rgba(245,158,11,.96);color:#fff}
.tag.done{background:rgba(16,185,129,.95);color:#fff}
.tag.fail{background:rgba(239,68,68,.95);color:#fff}
.pill{
  position:absolute;bottom:10px;right:10px;height:22px;padding:0 9px;border-radius:8px;
  background:rgba(14,16,21,.82);color:#fff;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;backdrop-filter:blur(6px);
}
.pill.mae{left:10px;right:auto}
.pill.mae{display:inline-flex;align-items:center}
.pill.mae::before{content:'';width:7px;height:7px;border-radius:50%;margin-right:5px;flex:0 0 7px}
.pill.g::before{background:#34d399}
.pill.y::before{background:#fbbf24}
.pill.r::before{background:#fb7185}
.chk{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;
  background:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.9);
  display:grid;place-items:center;opacity:0;transform:scale(.85);
  transition:opacity .14s var(--ease),transform .14s var(--ease),background .14s;
  box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:3;
  cursor:pointer;
}
/* 勾选框加大点击热区（视觉仍 22px），避免"点不中" */
.chk::before{content:'';position:absolute;inset:-7px}
.card:hover .chk,.card.sel .chk{opacity:1;transform:none}
/* 已选中时勾选框必须一直看得见，否则无法判断"这个勾上没有" */
.lrow .chk{position:static;opacity:1;transform:none;flex:0 0 20px;width:20px;height:20px;
  border:1.5px solid #d3d7e2;background:#fff;box-shadow:none;margin-right:11px}
.lrow .chk svg{color:#fff}
.lrow.sel .chk{background:var(--accent);border-color:var(--accent)}
.lrow.sel .chk svg{opacity:1}
.chk svg{width:13px;height:13px;color:#fff;opacity:0}
.card.sel .chk{background:var(--accent);border-color:var(--accent)}
.card.sel .chk svg{opacity:1}

/* ── 批量操作条 ── */
.selbar{
  display:none;align-items:center;gap:7px;padding:5px 6px 5px 13px;
  background:var(--accent-soft);border:1.5px solid #c7ccf8;border-radius:99px;
  animation:selin .16s var(--ease);
}
@keyframes selin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.selbar .count{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;margin-right:2px}
.sbtn{
  border:0;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;
  background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;
  box-shadow:0 1px 3px rgba(20,24,40,.10);transition:background .13s,transform .13s,opacity .13s;
}
.sbtn:hover{background:#f6f7fb;transform:translateY(-1px)}
.sbtn:active{transform:none}
.sbtn.danger{background:#fee2e2;color:#b91c1c}
.sbtn.danger:hover{background:#fecaca}
.sbtn.ghost{background:transparent;color:#5b6472;box-shadow:none}
.sbtn.ghost:hover{background:rgba(255,255,255,.7)}
.sbtn.dis{opacity:.4;pointer-events:none}
.quick{
  position:absolute;inset:auto 0 0 0;display:flex;gap:6px;justify-content:flex-end;padding:10px;
  background:linear-gradient(to top,rgba(10,12,18,.78),transparent);
  opacity:0;transform:translateY(6px);transition:opacity .16s var(--ease),transform .16s var(--ease);z-index:2;
}
.card:hover .quick{opacity:1;transform:none}
.qb{
  width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.92);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:background .13s,transform .13s;
}
.qb:hover{background:#fff;transform:scale(1.08)}
.qb:active{transform:scale(.96)}
.qb svg{width:15px;height:15px}
.media::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,10,16,.55) 0%,rgba(8,10,16,0) 34%),
             linear-gradient(to bottom,rgba(8,10,16,.42) 0%,rgba(8,10,16,0) 30%);
}
.card .body{padding:13px 14px 16px}
.card .ttl{
  font-size:13.5px;font-weight:650;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-all;letter-spacing:-.1px;
}
.card .info{
  margin-top:6px;font-size:12.5px;color:#5b6474;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;font-weight:500;
}
.card .info .dotsep{color:#c3c8d4}
.card .prog{margin-top:9px;height:5px;border-radius:99px;background:#eef0f4;overflow:hidden}
.card .prog i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .4s var(--ease)}
.card .prog.f i{background:linear-gradient(90deg,#ef4444,#f97316)}

/* ── 列表视图 ── */
.lrow{
  display:grid;grid-template-columns:minmax(180px,1.6fr) 120px 74px 84px 116px 96px;
  align-items:center;gap:12px;padding:2px 14px;height:56px;border-radius:var(--r-md);
  border:1px solid transparent;background:var(--card);cursor:default;user-select:none;
  transition:background .12s,border-color .12s,box-shadow .12s;
}
.lrow:hover{background:#fbfbfd;border-color:var(--line);box-shadow:var(--sh-1)}
.lrow.sel{background:var(--accent-soft);border-color:#c7ccf8}
.lhead{
  display:grid;grid-template-columns:minmax(180px,1.6fr) 120px 74px 84px 116px 96px;
  gap:12px;padding:0 14px;height:34px;align-items:center;
  font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;
  position:sticky;top:0;background:var(--bg);z-index:5;
}
.lrow .nm{display:flex;align-items:center;gap:12px;min-width:0}
.lrow .nm .th{
  width:42px;height:42px;flex:0 0 42px;border-radius:10px;overflow:hidden;background:#0e1015;
  position:relative;display:grid;place-items:center;
}
.lrow .nm .th img{width:100%;height:100%;object-fit:cover}
.lrow .nm .th.grad{background:var(--grad)}
.lrow .nm .th svg{width:20px;height:20px}
.lrow .nm .tx{min-width:0}
.lrow .nm .t1{
  font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lrow .nm .t2{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.lrow .cell{font-size:12.5px;color:var(--ink-2)}
.lrow .cell.mut{color:var(--ink-3)}
.chip{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;
  font-size:11px;font-weight:700;background:#f1f2f6;color:var(--ink-2);
}
.chip.g{background:#eaf7f1;color:#2f7f63}
.chip.y{background:#fdf5e7;color:#95651b}
.chip.r{background:#fbeeed;color:#a4433c}
.chip.i{background:var(--accent-soft);color:var(--accent)}

/* ── 空状态 ── */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:70px 20px;text-align:center;grid-column:1/-1;
}
.empty .circ{
  width:76px;height:76px;border-radius:24px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-2);
}
.empty .circ svg{width:32px;height:32px;color:#c3c8d4}
.empty h3{margin:0;font-size:15.5px;font-weight:700}
.empty p{margin:0;font-size:13px;color:var(--ink-3);max-width:440px;line-height:1.65}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
.sk{height:274px;border-radius:var(--r-lg);background:linear-gradient(100deg,#eef0f4 30%,#f7f8fa 50%,#eef0f4 70%);background-size:220% 100%;animation:shim 1.3s infinite}
@keyframes shim{from{background-position:180% 0}to{background-position:-40% 0}}

/* ── 拖拽 ── */
.dragov{
  position:fixed;inset:0;background:rgba(99,102,241,.10);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:200;
}
body.dragging .dragov{display:grid}
.dragov .bx{
  background:#fff;border-radius:22px;padding:34px 46px;text-align:center;box-shadow:var(--sh-3);
  border:2px dashed var(--accent);
}
.dragov .bx svg{width:42px;height:42px;color:var(--accent);margin-bottom:10px}
.dragov .bx b{display:block;font-size:15px}
.dragov .bx span{font-size:12.5px;color:var(--ink-3)}

/* ══════════════ 编排 / 状态 面板 ══════════════ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.panel-h{
  display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;
}
.panel-h h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h .sub2{font-size:12.5px;color:var(--ink-3);font-weight:500}
.panel-b{padding:16px 18px}
/* 封面提示条 */
.note{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);
  background:var(--accent-soft);color:#3730a3;font-size:12.5px;line-height:1.6;
}
.note svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.note code{background:rgba(255,255,255,.75);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
/* 媒体链两栏 */
.chain2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col2{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fcfcfd}
.col2 .hd{
  padding:10px 14px;font-size:12px;font-weight:700;color:var(--ink-2);background:#f7f8fa;
  border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;
}
.col2 .ls{overflow:auto;max-height:330px;padding:8px;display:flex;flex-direction:column;gap:5px}
.col2 .li{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;cursor:default;
  background:#fff;border:1px solid var(--line-2);font-size:13px;
  transition:border-color .13s,box-shadow .13s,transform .13s;
}
.col2 .li:hover{border-color:#c7ccf8;box-shadow:var(--sh-1)}
.col2 .li.add{cursor:pointer}
.col2 .li.add:hover{transform:translateX(2px);border-color:var(--accent)}
.col2 .li .idx{
  min-width:30px;height:22px;border-radius:7px;background:#f1f2f6;color:var(--ink-2);
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px;
}
.col2 .li .idx.entry{background:var(--grad);color:#fff}
.col2 .li .nm2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.col2 .li .act{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;cursor:pointer;
  color:var(--ink-3);transition:background .12s,color .12s;font-size:13px;
}
.col2 .li .act:hover{background:#f1f2f6;color:var(--ink)}
.col2 .li .act.del:hover{background:var(--bad-soft);color:var(--bad)}
.col2 .ft{padding:9px 12px;border-top:1px solid var(--line-2);display:flex;gap:8px;background:#f7f8fa}
.col2 .ft .btn{height:30px;padding:0 12px;font-size:12.5px}
/* 逐项链：项卡片（每项一个库，项内可配 模式/重复/权重） */
.lgh{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;
  padding:7px 6px 3px;display:flex;align-items:center;gap:6px}
.item{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--sh-1)}
.item-h{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#f7f8fa;
  border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.item-h .idx{min-width:38px;height:22px;border-radius:7px;background:#f1f2f6;color:var(--ink-2);
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.item-h .idx.entry{background:var(--grad);color:#fff}
.item-h .libnm{font-weight:650;font-size:12.5px;max-width:130px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--accent)}
.item-h .rn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:3px 7px}
.item-h .rn input{width:46px;border:0;background:transparent;font-size:12px;text-align:center;
  color:var(--ink);outline:none}
.item-h .act{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  cursor:pointer;color:var(--ink-3);font-size:13px;transition:background .12s,color .12s}
.item-h .act:hover{background:#eef0f4;color:var(--ink)}
.item-h .act.del:hover{background:var(--bad-soft);color:var(--bad)}
.item .clips{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px;align-items:center}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;
  background:#f4f5f9;border:1px solid var(--line-2);border-radius:9px;padding:4px 7px;max-width:100%}
.cchip>b{min-width:20px;height:18px;border-radius:6px;background:#fff;border:1px solid var(--line-2);
  font-size:10.5px;display:grid;place-items:center;padding:0 4px;color:var(--ink-2)}
.cchip .x{cursor:pointer;color:var(--ink-3);font-style:normal;font-size:11px;padding:0 2px}
.cchip .x:hover{color:var(--bad)}
.sel.sm{height:28px;font-size:12px;padding-right:22px;max-width:150px}
.sel.addc{height:28px;font-size:12px;align-self:center}
/* 接缝表 */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{
  text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--ink-3);
  letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);
}
table.tb td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover{background:#fbfbfd}
/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:#fcfcfd;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.stat .v{font-size:23px;font-weight:750;margin-top:5px;letter-spacing:-.5px}
.stat .v.sm{font-size:15px;font-weight:650;word-break:break-all;line-height:1.4}
.bar{height:7px;border-radius:99px;background:#eef0f4;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s var(--ease)}

/* ══════════════ 右键菜单 ══════════════ */
.ctx{
  position:fixed;z-index:1000;background:rgba(255,255,255,.97);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:6px;min-width:210px;display:none;
}
.ctx.on{display:block;animation:pop .13s var(--ease)}
.ctx .it{
  padding:9px 11px;border-radius:8px;cursor:default;font-size:13px;display:flex;align-items:center;gap:10px;
}
.ctx .it:hover{background:var(--accent-soft);color:var(--accent)}
.ctx .it.dis{color:#c3c8d4}
.ctx .it.dis:hover{background:transparent;color:#c3c8d4}
.ctx .hr{height:1px;background:var(--line-2);margin:5px 8px}

/* ══════════════ 弹层 ══════════════ */
.mask{
  position:fixed;inset:0;background:rgba(17,24,39,.42);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:900;padding:20px;
}
.mask.on{display:flex;animation:fade .16s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{
  background:#fff;border-radius:20px;box-shadow:0 32px 64px -16px rgba(16,24,40,.36);
  width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;
  animation:up .22s var(--ease);
}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.dlg h3{margin:0;padding:22px 24px 6px;font-size:17px;font-weight:700;letter-spacing:-.2px}
.dlg .bd{padding:12px 24px 4px;overflow:auto;flex:1}
.dlg .ft{padding:16px 24px 20px;display:flex;justify-content:flex-end;gap:9px}
.dlg input[type=text],.dlg input[type=number]{
  width:100%;height:42px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 13px;
  font-size:14px;outline:none;background:#fcfcfd;transition:border-color .15s,box-shadow .15s,background .15s;
}
.dlg input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 7px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.7}
.hint b{color:var(--ink-2)}
.hint code{background:#f1f2f6;padding:1.5px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pvw{display:flex;flex-direction:column;align-items:center;gap:16px}
.pvw .shots{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pvw .shot2{text-align:center}
.pvw .shot2 span{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.pvw .shot2 img{
  max-height:38vh;border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--sh-2);background:#0e1015;
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:13px;width:100%;max-width:520px}
.kv .k{color:var(--ink-3)}
.kv .v{color:var(--ink);font-weight:600;word-break:break-all}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
#toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:rgba(17,24,39,.94);backdrop-filter:blur(12px);color:#fff;padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:500;z-index:1200;box-shadow:0 16px 40px -8px rgba(0,0,0,.45);
  display:flex;align-items:center;gap:10px;max-width:80vw;
  transition:opacity .22s var(--ease),transform .22s var(--ease);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ic{width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:0 0 18px}
#toast.err .ic{background:var(--bad)}
#toast .ic svg{width:11px;height:11px;color:#fff}

@media (max-width:1000px){
  .side{width:74px;flex:0 0 74px}
  .brand h1,.brand p,.nitem .lb,.nitem .cnt,.sec{display:none}
  .brand{justify-content:center;padding:18px 0 12px}
  .nitem{justify-content:center;padding:0}
  .nitem.on::before{left:0}
  .sub{padding-left:0}
  .search{flex:1 1 auto;width:auto}
  .lhead,.lrow{grid-template-columns:minmax(120px,1fr) 100px 70px}
  .lhead span:nth-child(n+4),.lrow .cell:nth-child(n+4){display:none}
  .chain2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══════════ 侧边栏 ══════════ -->
<aside class="side">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 016.5 4h3.2l2 2.4h5.8A2.5 2.5 0 0120 8.9v8.6A2.5 2.5 0 0117.5 20h-11A2.5 2.5 0 014 17.5v-11z"/></svg>
    </div>
    <div>
      <h1>素材库</h1>
      <p>LiveTalking</p>
    </div>
  </div>
  <div class="side-scroll" id="side"></div>
</aside>

<!-- ══════════ 主区 ══════════ -->
<div class="main">
  <div class="topbar">
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="search" placeholder="搜索文件夹与片段…" autocomplete="off">
      <button class="clr" id="searchClr" title="清空">✕</button>
    </div>
    <div class="spacer"></div>
    <div class="sel-wrap"><select class="sel" id="kindBy" title="按训练状态 / 模型类型筛选">
      <option value="">全部</option>
      <option value="untrained">未训练 / 未就绪</option>
      <option value="wav2lip">wav2lip（口型对齐）</option>
      <option value="musetalk">musetalk（更像真人）</option>
    </select></div>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#475569;white-space:nowrap;cursor:pointer;user-select:none"
           title="训练完成后原始视频默认不再显示（数据不会删除，勾选即可看回）">
      <input type="checkbox" id="showDone" style="accent-color:#6366f1;width:14px;height:14px;margin:0">
      已训练的上传<span id="doneN" style="color:#94a3b8"></span>
    </label>
    <div class="sel-wrap"><select class="sel" id="sortBy" title="排序">
      <option value="name">名称 A→Z</option>
      <option value="name_d">名称 Z→A</option>
      <option value="frames">帧数 多→少</option>
      <option value="mae">首尾差异 小→大</option>
    </select></div>
    <div class="seg" id="viewSeg">
      <button data-v="icons" class="on" title="卡片视图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        卡片</button>
      <button data-v="list" title="列表视图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        列表</button>
    </div>
    <button class="btn" id="btnNewLib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建库</button>
    <!-- 批量操作条：只要有选中项就出现，把「选中之后能干嘛」直接摆出来。
         之前多选功能存在但没有可见出口，用户只能靠「更多」菜单猜。 -->
    <div class="selbar" id="selBar">
      <span class="count" id="selCount"></span>
      <button class="sbtn" id="selChain" title="用选中的片段组成素材链">编排素材链</button>
      <button class="sbtn" id="selTrain" title="把选中的原始视频加入训练队列">一键训练</button>
      <button class="sbtn danger" id="selDel" title="删除选中的项（Delete）">删除</button>
      <button class="sbtn ghost" id="selClear" title="清空选择（Esc）">清空</button>
    </div>
    <div class="menu-wrap">
      <button class="btn pri" id="btnUpload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 17v1.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V17"/></svg>上传</button>
    </div>
    <button class="btn icon" id="btnMore" title="更多操作">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <div class="menu" id="moreMenu">
      <div class="mi" data-a="newclip">新建片段</div>
      <div class="mi" data-a="train">一键训练</div>
      <div class="mi" data-a="chain">编排素材链</div>
      <div class="mi" data-a="del" style="color:#ef4444">删除选中</div>
      <div class="mi" data-a="refresh">重新扫描<span class="k">F5</span></div>
    </div>
  </div>

  <div class="crumb" id="crumb"></div>
  <div class="kindwarn" id="kindWarn" style="display:none"></div>
  <div class="content" id="content">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="dragov" id="dragov"><div class="bx">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 17v1.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V17"/></svg>
  <b>松开即可上传</b><span id="dragTarget">上传到当前库</span></div></div>

<div class="ctx" id="ctx"></div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>
<div id="toast"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></span><span id="toastMsg"></span></div>
<input type="file" id="filePick" accept="video/*" multiple style="display:none">

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   素材库 · 现代卡片界面
   数据: /api/libs  /api/libs/{lib}  /api/libs/tasks  /api/materials/active
   路由: #/  #/lib/<库>  #/lib/<库>/<片段>  #/chain  #/queue  #/active
   ══════════════════════════════════════════════════════════════════════════ */
const q = encodeURIComponent;

/* ───── HTTP ─────
   jget/jpost 失败时返回 {code:-1, msg}。
   ⚠️ 注意：fetch 抛出的 TypeError 在 Chrome 里 message 就是字面量 "Failed to fetch"，
   它对用户毫无信息量（分不清是服务没起、端口不通还是请求被取消）。
   这里做一次「人话翻译」，让错误提示能直接指导操作。 */
function netErrMsg(e, u){
  const m = String((e && e.message) || e || '');
  if (m.includes('Failed to fetch') || m.includes('NetworkError') || m.includes('Load failed')){
    return `无法连接到服务（${u}）。请确认 LiveTalking 已启动、端口正确，` +
           `并且这个页面是通过服务地址打开的（http://127.0.0.1:8010/materials.html），不要用 file:// 直接打开`;
  }
  if (m.includes('aborted') || (e && e.name === 'AbortError')) return '请求被取消（可能超时或页面切换）';
  return m || '请求失败';
}
async function jget(u){
  try { const r = await fetch(u); const t = await r.text();
    try { return JSON.parse(t); } catch(e){ return {code:-1,msg:'服务返回了非 JSON 内容: '+t.slice(0,160)}; }
  } catch(e){ return {code:-1, msg: netErrMsg(e, u)}; }
}
/* 带重试的读取：训练期间服务偶尔会因 GPU 忙而响应慢，单次失败不该让界面报错 */
async function jgetRetry(u, tries=3, delay=800){
  let last = null;
  for (let i=0;i<tries;i++){
    const r = await jget(u);
    if (r && r.code === 0) return r;
    last = r;
    if (r && r.code === -1) await new Promise(z => setTimeout(z, delay));
    else break;
  }
  return last || {code:-1, msg:'读取失败'};
}
async function jpost(u, body, method){
  try {
    const r = await fetch(u, {method:method||'POST',
      headers:{'Content-Type':'application/json; charset=utf-8'},
      body: body == null ? undefined : JSON.stringify(body)});
    const t = await r.text();
    try { return JSON.parse(t); } catch(e){ return {code:-1,msg:'服务返回了非 JSON 内容: '+t.slice(0,160)}; }
  } catch(e){ return {code:-1, msg: netErrMsg(e, u)}; }
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let tT = null, tOk = true;
function toast(msg, ms, isErr){
  const el = $('toast');
  $('toastMsg').textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(tT);
  tT = setTimeout(()=> el.classList.remove('on'), ms || 2800);
}
const fa = n => n == null ? '—' : Number(n).toFixed(2);
function maeCls(v){ return v == null ? '' : (v <= 1.5 ? 'g' : (v <= 3.0 ? 'y' : 'r')); }
function maeTxt(v){ return v == null ? '—' : Number(v).toFixed(2); }
function maeWord(v){ return v == null ? '—' : (v <= 1.5 ? '优秀' : (v <= 3.0 ? '可接受' : '不可用')); }
function mb(x){ return x == null ? '—' : (x >= 1024 ? (x/1024).toFixed(2)+' GB' : x.toFixed(1)+' MB'); }
function durS(sec){
  if (sec == null) return '—';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : sec.toFixed(1)+'s';
}
function hue(s){
  let h = 0;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h % 360;
}
function gradFor(name){
  const h = hue(name);
  return `linear-gradient(135deg, hsl(${h} 78% 62%), hsl(${(h+42)%360} 76% 50%))`;
}
/* 选中项的唯一 key。
 *
 * ⚠️ 必须与 selList() 的拼法**完全一致**，否则会出现「选中了，但删除/编排提示没选中」。
 * 历史 bug：根视图下库项的 it.lib 被填成了库自己的名字，
 * 于是 key 变成 `lib:NAME/NAME`（重复），而 selList() 找的是 `lib:NAME`
 * → 永远匹配不上，表现为「在根视图选中库后，删除/重命名毫无反应」。
 * 统一规则：lib/self 用 `lib:NAME`；clip 用 `clip:LIB/NAME`；upload 用 `upload:LIB/FILE`。
 */
const keyOf = it => {
  const k = it.kind;
  if (k === 'lib')  return 'lib:' + it.name;
  if (k === 'self') return 'self:' + it.name;
  if (k === 'clip' || k === 'upload') return k + ':' + (it.lib || '') + '/' + it.name;
  if (k === 'task') return 'task:' + it.name;
  return k + ':' + (it.lib ? it.lib + '/' : '') + it.name;
};

/* ══════════════════════════════════════════════════════════════
   侧边栏
   ══════════════════════════════════════════════════════════════ */
function renderSide(){
  const h = [];
  const runN = S.tasks.filter(t=>t.status==='running').length;
  const pendN = S.tasks.filter(t=>t.status==='pending').length;
  const doneN = S.tasks.filter(t=>t.status==='completed').length;

  h.push(`<div class="sec">${S.q.trim() ? '搜索结果' : '素材库'}</div>`);
  h.push(navRow({kind:'root'}, `<span class="ico">${I.box}</span>`, '全部素材库',
        `${S.libs.length}`, ''));

  const kw = S.q.trim().toLowerCase();
  for (const L of S.libs){
    // 搜索时同时过滤左侧列表：命中库名本身，或库内有片段命中
    if (kw && !(
        L.name.toLowerCase().includes(kw) ||
        L.clips.some(c => c.name.toLowerCase().includes(kw)) ||
        L.uploads.some(u => u.file.toLowerCase().includes(kw))
      )) continue;
    const open = kw ? true : S.expanded.has(L.name);   // 搜索时自动展开，方便看到命中的片段
    const wait = L.uploads.filter(u=>!u.trained_as).length;
    let badge = L.clip_count ? `${L.clip_count} 段` : (L.self_ready ? '素材' : '空');
    let cls = '';
    if (wait){ badge = `${wait} 待训`; cls = 'warn'; }
    else if (!L.clip_count && !L.self_ready && !L.uploads.length){ badge = '空库'; }
    // ⚠️ 展开箭头不能只看 clip_count：只有上传视频、还没训练的库
    //    （clip_count=0 但 uploads>0）也必须能展开，否则用户看不到自己刚上传的文件。
    const hasKids = L.clip_count > 0 || L.uploads.length > 0;
    const chev = hasKids
      ? `<span class="chev" data-tw="${esc(L.name)}">${open?'▼':'▶'}</span>`
      : `<span class="chev"></span>`;
    h.push(
      `<div class="nitem${on(L.name)}" data-kind="lib" data-lib="${esc(L.name)}" title="${esc(L.name)}">` +
      chev +
      `<span class="ico dot${(L.clip_count||L.self_ready||L.uploads.length)?' has':''}"></span>` +
      `<span class="lb">${esc(L.name)}</span>` +
      `<span class="cnt ${cls}">${esc(badge)}</span>` +
      // 悬停操作：重命名 / 删除（之前只能靠右键卡片，发现不了）
      `<span class="hops">` +
        `<span class="hbtn" data-op="ren-lib" data-lib="${esc(L.name)}" title="重命名库">${I.pen}</span>` +
        `<span class="hbtn del" data-op="del-lib" data-lib="${esc(L.name)}" title="删除库">${I.trash}</span>` +
      `</span></div>`
    );
    if (open){
      h.push('<div class="sub">');
      for (const c of L.clips){
        if (kw && !c.name.toLowerCase().includes(kw) && !L.name.toLowerCase().includes(kw)) continue;
        if (!kindPass({kind:'clip', obj:c})) continue;   // 与内容区同一套筛选语义
        const ktag = c.kind === 'musetalk' ? '<span class="kt m">muse</span>'
                   : c.kind === 'wav2lip'  ? '<span class="kt w">wav</span>' : '';
        h.push(
          `<div class="nitem${on(L.name, c.name)}" data-kind="clip" data-lib="${esc(L.name)}" data-clip="${esc(c.name)}" title="${esc(c.name)} · ${esc(c.kind || '')}">` +
          `<span class="chev"></span><span class="ico">${kindIco(c.kind)}</span>` +
          `<span class="lb">${esc(c.name)}</span>` + ktag +
          `<span class="cnt ${c.trained?'':'warn'}">${c.frames||0}</span>` +
          `<span class="hops">` +
            `<span class="hbtn" data-op="ren-clip" data-lib="${esc(L.name)}" data-clip="${esc(c.name)}" title="重命名片段">${I.pen}</span>` +
            `<span class="hbtn del" data-op="del-clip" data-lib="${esc(L.name)}" data-clip="${esc(c.name)}" title="删除片段">${I.trash}</span>` +
          `</span></div>`
        );
      }
      for (const u of L.uploads){
        if (!uploadVisible({kind:'upload', obj:u})) continue;   // 已训练的上传默认隐藏
        if (kw && !u.file.toLowerCase().includes(kw) && !L.name.toLowerCase().includes(kw)) continue;
        h.push(
          `<div class="nitem" data-kind="upload" data-lib="${esc(L.name)}" data-clip="${esc(u.stem)}" title="${esc(u.file)}">` +
          `<span class="chev"></span><span class="ico">${I.up}</span>` +
          `<span class="lb">${esc(u.file)}</span>` +
          `<span class="cnt ${u.trained_as?'':'warn'}">${u.trained_as?'已训':'待训'}</span>` +
          `<span class="hops">` +
            `<span class="hbtn" data-op="ren-up" data-lib="${esc(L.name)}" data-file="${esc(u.file)}" title="重命名文件">${I.pen}</span>` +
            `<span class="hbtn del" data-op="del-up" data-lib="${esc(L.name)}" data-file="${esc(u.file)}" title="删除上传文件">${I.trash}</span>` +
          `</span></div>`
        );
      }
      h.push('</div>');
    }
  }

  h.push(`<div class="sec">工作区</div>`);
  h.push(navRow({kind:'queue'}, `<span class="ico">${I.clock}</span>`, '训练队列',
    runN ? `${runN} 运行中` : (pendN ? `${pendN} 排队` : (doneN ? `${doneN} 已完成` : '空闲')),
    runN||pendN ? 'warn' : 'ok'));
  const pl = curLib() && curLib().playlist;
  h.push(navRow({kind:'chain'}, `<span class="ico">${I.link}</span>`, '素材链编排',
    pl && (pl.segments||[]).length ? `${(pl.segments||[]).length} 段` : '未编排', ''));
  h.push(navRow({kind:'active'}, `<span class="ico">${I.pulse}</span>`, '实时状态',
    S.active.length ? `${S.active.length} 会话` : '无会话', S.active.length ? 'live' : ''));

  $('side').innerHTML = h.join('');
}
function on(lib, clip){
  if (S.cur.kind === 'root') return '';
  if (clip) return (S.cur.kind==='clip' && S.cur.lib===lib && S.cur.clip===clip) ? ' on' : '';
  if (S.cur.kind === 'lib') return S.cur.lib === lib ? ' on' : '';
  return '';
}
function navRow(pos, ico, label, badge, cls){
  const active = S.cur.kind === pos.kind && pos.kind !== 'lib' ? ' on' : '';
  return `<div class="nitem${active}" data-kind="${pos.kind}" title="${esc(label)}">` +
    `<span class="chev"></span>${ico}<span class="lb">${esc(label)}</span>` +
    `<span class="cnt ${cls}">${esc(badge)}</span></div>`;
}

function renderCrumb(){
  const segs = [{l:'素材库', pos:{kind:'root'}}];
  if (S.cur.kind === 'lib' || S.cur.kind === 'clip')
    segs.push({l:S.cur.lib, pos:{kind:'lib', lib:S.cur.lib}});
  if (S.cur.kind === 'clip')
    segs.push({l:S.cur.clip, pos:{kind:'clip', lib:S.cur.lib, clip:S.cur.clip}});
  const nm = {queue:'训练队列', chain:'素材链编排', active:'实时状态'};
  if (nm[S.cur.kind]) segs.push({l:nm[S.cur.kind], pos:{kind:S.cur.kind}});

  let h = '';
  segs.forEach((s,i)=>{
    if (i) h += `<span class="sep">/</span>`;
    const last = i === segs.length-1;
    h += `<span class="seg2${last?' last':''}" data-kind="${s.pos.kind}"` +
      (s.pos.lib?` data-lib="${esc(s.pos.lib)}"`:'') +
      (s.pos.clip?` data-clip="${esc(s.pos.clip)}"`:'') +
      ` title="${esc(s.l)}">${esc(s.l)}</span>`;
  });
  h += `<span class="meta">${crumbMeta()}</span>`;
  $('crumb').innerHTML = h;
  renderKindWarn();
}
/* 库内同时存在 wav2lip 与 musetalk 片段时给出醒目提示：
   两者不能编在同一条素材链里（服务一次只加载一种模型），
   引导用户用顶栏「模型筛选」分开看、分开编排。 */
function renderKindWarn(){
  const el = $('kindWarn'); if (!el) return;
  const L = (S.cur.kind === 'lib' || S.cur.kind === 'clip') ? curLib() : null;
  if (!L || !L.mixed){ el.style.display = 'none'; el.innerHTML = ''; return; }
  const k = L.kinds || {};
  const parts = [];
  if (k.wav2lip) parts.push(`wav2lip <b>${k.wav2lip}</b> 段`);
  if (k.musetalk) parts.push(`musetalk <b>${k.musetalk}</b> 段`);
  if (k.unknown) parts.push(`未就绪 <b>${k.unknown}</b> 段`);
  el.style.display = 'flex';
  el.innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;flex:0 0 18px;margin-top:1px"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>` +
    `<div><b>这个库里混着两种模型的片段</b>（${parts.join(' · ')}）。<br>` +
    `同一条素材链<b>不能混用</b>不同模型 —— 服务一次只加载一种模型。` +
    `请用左上角「模型筛选」只留一种，再勾选编排；` +
    `或把片段用右键「移动到其他库」按模型分开存放。</div>`;
}
function crumbMeta(){
  if (S.cur.kind === 'chain') return '拖动顺序 · 保存后实时生效';
  if (S.cur.kind === 'queue') return '串行执行 · 一个完成再跑下一个';
  if (S.cur.kind === 'active') return '正在播放的素材链';
  const v = viewItems(), all = currentItems();
  const kw = S.q.trim();
  if (kw) return `${v.length} / ${all.length} 个匹配`;
  return `${v.length} 个项目`;
}

/* ══════════════════════════════════════════════════════════════
   条目模型
   ══════════════════════════════════════════════════════════════ */
function currentItems(){
  if (S.cur.kind === 'root')
    return S.libs.map(L => ({kind:'lib', lib:L.name, name:L.name, obj:L}));
  if (S.cur.kind === 'lib' || S.cur.kind === 'clip'){
    const L = curLib(); if (!L) return [];
    const out = L.clips.map(c => ({kind:'clip', lib:L.name, name:c.name, obj:c}));
    // 老式单目录素材：data/avatars/<id>/ 本身就是素材（官方 avatar 与 start.bat 用的）
    if (!L.clip_count && L.self_ready) out.push({kind:'self', lib:L.name, name:L.name, obj:L});
    for (const u of L.uploads) out.push({kind:'upload', lib:L.name, name:u.file, stem:u.stem, obj:u});
    return out;
  }
  if (S.cur.kind === 'queue')
    return S.tasks.map(t => ({kind:'task', name:t.task_id, obj:t}));
  return [];
}
function itemFrames(it){
  if (it.kind === 'clip') return it.obj.frames;
  if (it.kind === 'self') return it.obj.self_frames;
  if (it.kind === 'lib')  return it.obj.self_frames || 0;
  return null;
}
function itemMae(it){ return it.kind === 'clip' ? it.obj.tail_head_mae : null; }
// ── 顶栏筛选的唯一判定入口（内容区与侧栏共用，避免两处逻辑各自演化）──
// 三档语义（用户要求把这三者彻底分开）：
//   ''        全部：片段 + 上传 + 库
//   untrained 未训练 / 未就绪：还没产出可用片段的东西
//             （没训练的上传视频、缺文件的片段目录、空库）
//   wav2lip / musetalk：只留已训练且类型匹配的片段（+ 含该类型的库）
// 上传是「原始视频」，本身没有模型类型，所以模型档一律不显示它 ——
// 以前这里是 `if (x.kind === 'upload') return true;`，
// 导致筛 musetalk 时未训练视频与同源上传全都混在里面。
function kindPass(x){
  const f = S.kind; if (!f) return true;
  const o = x.obj || {};
  const work = (f === 'untrained' || f === 'unknown');   // unknown 为旧值，兼容
  if (x.kind === 'clip')   return work ? !o.trained : (!!o.trained && o.kind === f);
  if (x.kind === 'upload') return work ? !o.trained_as : false;
  if (x.kind === 'self')   return work ? false : (o.self_kind === f);   // 单目录素材=已成品
  if (x.kind === 'lib'){
    if (work){
      return (o.uploads || []).some(u => !u.trained_as)
          || (o.clips || []).some(c => !c.trained)
          || (!o.clip_count && !o.self_ready && !(o.uploads || []).length);   // 空库
    }
    const ks = (o.trained_kinds && o.trained_kinds.length)
      ? o.trained_kinds
      : Object.keys(o.kinds || {}).filter(k => k !== 'unknown');
    return ks.length ? ks.includes(f) : true;   // 还没训练出任何片段 → 保留（否则没法继续训练）
  }
  return true;
}
// 「已训练的上传」默认隐藏：训练完原始视频就不再占画面（数据仍在，勾选即可看回）
function uploadVisible(x){
  if (x.kind !== 'upload') return true;
  if (S.kind) return kindPass(x);
  return S.showDone || !(x.obj && x.obj.trained_as);
}
function viewItems(){
  let it = currentItems();
  const kw = S.q.trim().toLowerCase();
  if (kw) it = it.filter(x => String(x.name).toLowerCase().includes(kw));
  // 筛选：先按三档语义过滤，再把「已训练的上传」按开关隐藏
  if (S.kind) it = it.filter(kindPass);
  it = it.filter(uploadVisible);
  const s = S.sort;
  const cmp = (a,b) => String(a.name).localeCompare(String(b.name), 'zh', {numeric:true});
  return it.slice().sort((a,b)=>{
    if (s === 'name_d') return cmp(b,a);
    if (s === 'frames') return (itemFrames(b)||0) - (itemFrames(a)||0);
    if (s === 'mae'){
      const x = itemMae(a), y = itemMae(b);
      return (x==null?99:x) - (y==null?99:y);
    }
    return cmp(a,b);
  });
}

function renderContent(){
  const g = $('grid');
  // 「已训练的上传」当前被隐藏了几个：显示在勾选框旁，免得用户以为文件丢了
  const _dn = $('doneN');
  if (_dn){
    const _L = (S.cur.kind === 'lib' || S.cur.kind === 'clip') ? curLib() : null;
    const _n = _L ? (_L.uploads || []).filter(u => u.trained_as).length : 0;
    _dn.textContent = _n ? ' (' + _n + ')' : '';
  }
  if (S.cur.kind === 'chain'){ renderChain(); return; }
  if (S.cur.kind === 'active'){ renderActive(); return; }

  if (!S.loaded){
    g.className = 'skel';
    g.innerHTML = Array.from({length:8}, ()=>'<div class="sk"></div>').join('');
    return;
  }
  const items = viewItems();
  if (!items.length){
    g.className = 'grid';
    g.innerHTML = emptyHTML();
    return;
  }
  if (S.view === 'list'){
    g.className = 'grid list';
    g.innerHTML = `<div class="lhead"><span>名称</span><span>类型</span><span>帧数</span>` +
      `<span>时长</span><span>分辨率</span><span>首尾差异</span></div>` +
      items.map(lrowHTML).join('');
  } else {
    g.className = 'grid';
    g.innerHTML = items.map(cardHTML).join('');
  }
}
function emptyHTML(){
  const kw = S.q.trim();
  if (kw){
    return `<div class="empty"><div class="circ">${I.searchEmpty}</div>
      <h3>没有匹配「${esc(kw)}」的项目</h3>
      <p>试试别的关键词，或者点右上角的搜索框清空。</p></div>`;
  }
  if (S.cur.kind === 'root')
    return `<div class="empty"><div class="circ">${I.plusCircle}</div>
      <h3>还没有素材库</h3>
      <p>先点右上角「新建库」建一个数字人库（库名就是以后在直播页要填的角色 ID），
         再把视频拖进来，然后点「一键训练」。</p>
      <button class="btn pri" onclick="newLib()">新建第一个库</button></div>`;
  if (S.cur.kind === 'lib')
    return `<div class="empty"><div class="circ">${I.uploadBig||I.up}</div>
      <h3>这个库还是空的</h3>
      <p>把原始视频<b>拖到这里</b>，或者点右上角「上传」。
         上传后到「更多 → 一键训练」生成素材，就能加入素材链了。</p>
      <button class="btn pri" onclick="doUpload()">上传视频</button></div>`;
  if (S.cur.kind === 'queue')
    return `<div class="empty"><div class="circ">${I.clock}</div>
      <h3>训练队列是空的</h3>
      <p>在库页面点「更多 → 一键训练」把待训练的视频加进来。队列是串行的。</p></div>`;
  return `<div class="empty"><div class="circ">${I.box}</div><h3>没有内容</h3></div>`;

function cardHTML(it){
  const k = keyOf(it), sel = S.sel.has(k) ? ' sel' : '';
  let media = '', title = '', info = [], tag = '', pill = '', act = '', prog = '';

  if (it.kind === 'lib'){
    const L = it.obj;
    const wait = L.uploads.filter(u=>!u.trained_as).length;
    const fc = L.clips.find(c=>c.trained);
    const src = fc ? `/api/libs/${q(L.name)}/clipframe?clip=${q(fc.name)}&which=first`
                   : (L.self_ready ? `/api/materials/${q(L.name)}/frame?which=first` : null);
    media = src
      ? `<div class="media"><img class="cover" loading="lazy" src="${src}" alt=""><img class="shot" loading="lazy" src="${src}" alt=""></div>`
      : `<div class="media grad" style="background:${gradFor(L.name)}"><div class="glyph">${I.folder}</div></div>`;
    title = `<div class="ttl">${esc(L.name)}</div>`;
    info = [
      L.clip_count ? `${L.clip_count} 个片段`
        : (L.self_ready ? `${L.self_frames} 帧 · 单目录素材` : '空库'),
      L.uploads.length ? `${L.uploads.length} 个上传` : null,
    ].filter(Boolean);
    if (wait) tag = `<span class="tag wait">${wait} 待训练</span>`;
    else if (L.has_playlist) tag = `<span class="tag ready">已编排</span>`;
    if (L.clip_count) pill = `<span class="pill">${L.clip_count} 段</span>`;
    act = qb('预览', I.play, `onPreview('${esc(L.name)}')`) +
          qb('删除', I.trash, `onQuickDel('lib','${esc(L.name)}','${esc(L.name)}')`);
  }
  else if (it.kind === 'self'){
    const L = it.obj;
    const src = `/api/materials/${q(L.name)}/frame?which=first`;
    media = `<div class="media"><img class="cover" loading="lazy" src="${src}" alt=""><img class="shot" loading="lazy" src="${src}" alt=""></div>`;
    title = `<div class="ttl">${esc(L.name)}</div>`;
    info = [`${L.self_frames} 帧`, durS(L.self_frames/25) + ' @25fps'];
    tag = `<span class="tag ready">可直接用</span>`;
    pill = `<span class="pill">单目录</span>`;
    act = qb('预览', I.play, `previewSelf('${esc(it.lib)}')`) +
          qb('复制角色 ID', I.link, `copyId('${esc(it.lib)}')`);
  }
  else if (it.kind === 'clip'){
    const c = it.obj;
    const src = `/api/libs/${q(it.lib)}/clipframe?clip=${q(c.name)}&which=first`;
    // 空片段（手动新建的文件夹 / 训练中断）没有帧可取 → 用渐变占位，避免 <img> 裂图
    media = c.empty
      ? `<div class="media grad" style="background:${gradFor(c.name)}">` +
        `<div class="glyph" style="opacity:.28;width:78px;height:78px">${I.box}</div>` +
        `<div class="glyph" style="position:absolute">${I.film}</div></div>`
      : `<div class="media"><img class="cover" loading="lazy" src="${src}" alt=""><img class="shot" loading="lazy" src="${src}" alt=""></div>`;
    title = `<div class="ttl">${esc(c.name)}</div>`;
    info = [c.kind === 'musetalk' ? 'musetalk' : (c.kind === 'wav2lip' ? 'wav2lip' : '未就绪'),
            `${c.frames} 帧`,
            (c.width && c.height) ? `${c.width}×${c.height}` : null].filter(Boolean);
    tag = c.trained ? '' : `<span class="tag wait">未训练</span>`;
    pill = `<span class="pill">${durS(c.duration_sec)}</span>`;
    if (c.tail_head_mae != null)
      pill += `<span class="pill mae ${maeCls(c.tail_head_mae)}" title="段内首尾帧差异 MAE：结尾帧与开头帧的像素差，越小越能无缝循环播放（≤1.5 优秀 / 1.5~3 可接受 / &gt;3 不可用）">首尾 ${maeTxt(c.tail_head_mae)}</span>`;
    act = (c.empty ? '' : qb('预览首尾帧', I.play, `previewClip('${esc(it.lib)}','${esc(c.name)}')`)) +
          qb('删除', I.trash, `onQuickDel('clip','${esc(it.lib)}','${esc(c.name)}')`);
  }
  else if (it.kind === 'upload'){
    const u = it.obj;
    media = `<div class="media grad" style="background:${gradFor(it.stem)}">` +
      `<div class="glyph" style="opacity:.28;width:78px;height:78px">${I.film}</div>` +
      `<div class="glyph" style="position:absolute">${I.up}</div></div>`;
    title = `<div class="ttl">${esc(u.file)}</div>`;
    info = [mb(u.size_mb), '原始视频'];
    tag = u.trained_as
      ? `<span class="tag done">已训练</span>`
      : `<span class="tag wait">待训练</span>`;
    pill = `<span class="pill">${u.trained_as ? '已训练为 '+esc(u.trained_as) : '待训练'}</span>`;
    act = (u.trained_as ? qb('打开片段', I.play, `goTo({kind:'clip',lib:'${esc(it.lib)}',clip:'${esc(u.trained_as)}'})`) : '') +
          qb('训练', I.up, `trainOne('${esc(it.lib)}','${esc(u.file)}')`) +
          qb('删除', I.trash, `onQuickDel('upload','${esc(it.lib)}','${esc(u.file)}')`);
  }
  else if (it.kind === 'task'){
    const t = it.obj;
    const st = {pending:'排队中',running:'训练中',completed:'已完成',failed:'失败'}[t.status] || t.status;
    const pct = Math.max(0, Math.min(100, Math.round(t.progress||0)));
    const ic = t.status==='completed' ? I.tick : (t.status==='failed' ? I.x : I.film);
    media = `<div class="media grad" style="background:${t.status==='failed'

      `<div class="glyph">${ic}</div></div>`;
    title = `<div class="ttl">${esc(t.avatar_id || '—')}</div>`;
    info = [t.model_type || '—', st, `${pct}%`];
    tag = `<span class="tag ${t.status==='failed'?'fail':(t.status==='completed'?'done':'wait')}">${esc(st)}</span>`;
    prog = `<div class="prog${t.status==='failed'?' f':''}"><i style="width:${pct}%"></i></div>`;
    if (t.error_msg) info.push(String(t.error_msg).slice(0,40));
  }

  // 叠加层必须放进 .media 内部，否则绝对定位会落到整张卡片上（会压住下面的文字）
  const ov = `<span class="chk" title="勾选（可多选）">${I.check}</span>${tag}${pill}<div class="quick">${act}</div>`;
  const mediaFull = media.endsWith('</div>') ? media.slice(0, -6) + ov + '</div>' : media + ov;

    (it.lib?` data-lib="${esc(it.lib)}"`:'') + (it.stem?` data-stem="${esc(it.stem)}"`:'') + `>
    ${mediaFull}
    <div class="body">
      ${title}
      <div class="info">${info.map((x,i)=> (i?'<span class="dotsep">·</span>':'') + `<span>${esc(x)}</span>`).join('')}</div>
      ${prog}
    </div>
  </div>`;
}
function qb(tip, svg, onclick){

function lrowHTML(it){
  const k = keyOf(it);                       // ← 必须：下面 data-key 与勾选态都靠它（原先直接用未声明的 k 会 ReferenceError）
  const sel = S.sel.has(k) ? ' sel' : '';
  let th, t2 = '', kind = '', frames = '—', d = '—', res = '—', mae = '—';

  if (it.kind === 'lib' || it.kind === 'self'){
    const L = it.obj;
    const fc = (L.clips||[]).find(c=>c.trained);
    const src = fc ? `/api/libs/${q(L.name)}/clipframe?clip=${q(fc.name)}&which=first`
                   : `/api/materials/${q(L.name)}/frame?which=first`;
    th = `<span class="th"><img loading="lazy" src="${src}" alt=""></span>`;
    kind = L.clip_count ? '库（文件夹）' : '单目录素材';
    t2 = L.clip_count ? `${L.clip_count} 个片段` : `${L.self_frames} 帧`;
    frames = L.clip_count ? `${L.clip_count} 段` : L.self_frames;
    d = L.clip_count ? '—' : durS(L.self_frames/25);
  } else if (it.kind === 'clip'){
    const c = it.obj;
    const src = `/api/libs/${q(it.lib)}/clipframe?clip=${q(c.name)}&which=first`;
    th = `<span class="th"><img loading="lazy" src="${src}" alt=""></span>`;
    kind = c.kind === 'musetalk' ? 'musetalk 片段' : (c.kind === 'wav2lip' ? 'wav2lip 片段' : '未就绪片段');
    t2 = c.name === it.name ? it.lib : '';
    frames = c.frames; d = durS(c.duration_sec);
    res = (c.width&&c.height) ? `${c.width}×${c.height}` : '—';
    mae = c.tail_head_mae == null ? '—'
      : `<span class="chip ${maeCls(c.tail_head_mae)}">${maeTxt(c.tail_head_mae)} ${maeWord(c.tail_head_mae)}</span>`;
  } else if (it.kind === 'upload'){
    const u = it.obj;
    th = `<span class="th grad" style="background:${gradFor(it.stem)}"><span style="color:#fff">${I.up}</span></span>`;
    kind = '原始视频';
    t2 = mb(u.size_mb);
    frames = '—';
    mae = u.trained_as ? `<span class="chip g">已训练为 ${esc(u.trained_as)}</span>`
                       : `<span class="chip y">待训练</span>`;
  } else if (it.kind === 'task'){
    const t = it.obj;
    const pct = Math.round(t.progress||0);
    th = `<span class="th grad"><span style="color:#fff">${t.status==='completed'?I.tick:(t.status==='failed'?I.x:I.film)}</span></span>`;
    kind = {pending:'排队中',running:'训练中',completed:'已完成',failed:'失败'}[t.status]||t.status;
    t2 = `${t.model_type||''} · ${pct}%`;
    frames = '—';
  }
  return `<div class="lrow${sel}" data-key="${esc(k)}" data-kind="${it.kind}" data-name="${esc(it.name)}"` +
    (it.lib?` data-lib="${esc(it.lib)}"`:'') + (it.stem?` data-stem="${esc(it.stem)}"`:'') + `>
    <span class="chk" title="勾选（可多选）">${I.check}</span>
    <span class="nm">${th}<span class="tx"><span class="t1">${esc(it.name)}</span>` +
    (t2?`<span class="t2">${esc(t2)}</span>`:'') + `</span></span>
    <span class="cell">${esc(kind)}</span>
    <span class="cell mut">${frames}</span>
    <span class="cell mut">${d}</span>
    <span class="cell mut">${res}</span>
    <span class="cell">${mae}</span>
  </div>`;
}
