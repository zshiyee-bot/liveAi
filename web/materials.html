/* ══════════════════════════════════════════════════════════════
   素材链编排
   ══════════════════════════════════════════════════════════════ */
/* ── 逐项链（v2）数据模型 ───────────────────────────────────────────
   一条链 = 有序列项；每项 = {lib, mode(项内), clips[], repeat, weight}
     · 项内模式：这个库里的片段怎么轮（顺序 / 随机 / 不重复）
     · 重复次数：这一项播几轮才进下一项
     · 权重    ：项与项之间随机时被抽中的相对概率
   入口 = 第一项的第一个片段（保存时 entry 由它决定）。
   旧格式 v1（单组扁平 segments）会被读成「一个项」，行为逐字等价。 */
function playlistToItems(pl, L){
  if (pl && Array.isArray(pl.groups) && pl.groups.length){
    return pl.groups.map(g => ({
      lib: g.lib || L.name,
      mode: ['sequence','shuffle','weight'].includes(g.mode) ? g.mode : 'sequence',
      clips: (g.clips || []).map(String).filter(Boolean),
      repeat: Math.min(999, Math.max(1, parseInt(g.repeat, 10) || 1)),
      weight: Math.max(0, Number(g.weight == null ? 1 : g.weight) || 0),
    })).filter(it => it.clips.length);
  }
  const segs = (pl && pl.segments) || [];
  if (!segs.length) return [];
  return [{lib: L.name, mode: (pl.mode || 'shuffle'), clips: segs.slice(), repeat: 1, weight: 1}];
}
function itemsToGroups(items){
  return (items || []).filter(it => it.clips.length).map(it => ({
    lib: it.lib, mode: it.mode, clips: it.clips.slice(),
    repeat: it.repeat, weight: it.weight,
  }));
}
// (库, 片段名) → 片段元数据（S.libs 里已带 kind / frames / tail_head_mae 等）
function clipMeta(libName, name){
  const LB = S.libs.find(x => x.name === libName);
  return LB ? ((LB.clips || []).find(c => c.name === name) || null) : null;
}
function itemKind(it){
  for (const n of (it.clips || [])){
    const c = clipMeta(it.lib, n);
    if (c && c.kind && c.kind !== 'unknown') return c.kind;
  }
  return null;
}
function draftKind(items){
  for (const it of (items || [])){ const k = itemKind(it); if (k) return k; }
  return null;
}
function draftNameSet(items){
  const s = new Set();
  (items || []).forEach(it => (it.clips || []).forEach(n => s.add(it.lib + '/' + n)));
  return s;
}
// 把片段加进「它所属库」的那一项；没有这一项就新建（追加在最后）
function addClipToLibItem(libName, clipName){
  if (!S.chainItems) S.chainItems = [];
  let it = S.chainItems.find(x => x.lib === libName);
  if (!it){ it = {lib: libName, mode: 'sequence', clips: [], repeat: 1, weight: 1}; S.chainItems.push(it); }
  if (!it.clips.includes(clipName)) it.clips.push(clipName);
  S.chainDraftLib = S.chainLib;
}

function renderChain(){
  const g = $('grid'); g.className = 'grid';
  const usables = S.libs.filter(L => L.clip_count > 0);
  if (!usables.length){
    g.innerHTML = `<div class="empty"><div class="circ">${I.link}</div>
      <h3>还没有可编排的片段</h3>
      <p>素材链是「多个片段按顺序/随机拼接播放」，所以需要至少 2 个已训练片段。<br>
         先新建一个库 → 上传视频 → 一键训练，然后再回来编排。</p>
      <button class="btn pri" onclick="newLib()">新建库</button></div>`;
    return;
  }
  if (!S.chainLib || !usables.find(L => L.name === S.chainLib))
    S.chainLib = (S.cur.lib && usables.find(L=>L.name===S.cur.lib) ? S.cur.lib : usables[0].name);
  const L = S.libs.find(x => x.name === S.chainLib);
  const pl = L.playlist || {};
  if (!S.chainItems || S.chainDraftLib !== L.name){
    S.chainItems = playlistToItems(pl, L);
    S.chainDraftLib = L.name;
    S.chainMode = pl.mode || 'shuffle';
  }
  const trained = L.clips.filter(c => c.trained);
  // 模型一致性：一条链只能有一种模型（服务一次只驻留一种）。
  // 链的模型 = 草稿里第一个有 kind 的片段；草稿空时退到本库第一个已训练片段。
  const KNAME = {wav2lip:'wav2lip', musetalk:'musetalk', unknown:'未识别'};
  const chainKind = draftKind(S.chainItems)
    || ((trained.find(c => c.kind && c.kind !== 'unknown') || {}).kind) || null;
  const setName = draftNameSet(S.chainItems);
  const segCount = S.chainItems.reduce((a, it) => a + it.clips.length, 0);
  const itemCount = S.chainItems.filter(it => it.clips.length).length;
  const mixedSelected = new Set(S.chainItems.map(itemKind).filter(Boolean)).size > 1;
  const modeOpts = [['sequence','顺序循环'],['shuffle','随机（等概率）'],
                    ['weight','随机 · 不重复']];
  const modeHint = {
    shuffle:'每段播完随机挑一段（不会连续重复同一段）。<b>所有段等概率</b>，与段时长无关。',
    weight:'随机，但<b>本轮还没播过的段优先</b> —— 播得越少概率越大，一轮内每段必然出现一次。',
    sequence:'严格按顺序 1→2→3→…→1 循环，完全可预测。',
  };
  const outerHint = {
    sequence:'播完一项，就轮到下一项（按下面的项序循环）。',
    shuffle:'播完一项，随机挑另一项（排除刚播过的那项）。等概率，可用「权重」倾斜。',
    weight:'播完一项，在<b>本轮还没播过的项</b>里随机挑 —— 保证每个项都会轮到，长项不会被反复抽到。',
  };
  const kindTip = chainKind
    ? `<div class="note" style="margin-bottom:12px;background:#eef2ff;border-color:#c7d2fe">
         ${I.info}<div>本条素材链锁定为 <b>${KNAME[chainKind] || chainKind}</b> 模型
         （跨库拼接也只能拼同模型）。</div></div>`
    : '';
  const mixedTip = mixedSelected
    ? `<div class="note" style="margin-bottom:12px;background:#fef2f2;border-color:#fecaca">
         ${I.info}<div style="color:#b91c1c"><b>当前链里混了不同模型的片段，保存会被拒绝。</b>
         请移除后再保存。</div></div>`
    : '';
  // 可加入候选：按库分组；只列与本链同模型的片段
  const candHTML = S.libs.filter(x => x.clip_count > 0).map(LB => {
    const cs = (LB.clips || []).filter(c => c.trained
      && (!chainKind || c.kind === chainKind)
      && !setName.has(LB.name + '/' + c.name));
    if (!cs.length) return '';
    return `<div class="lgh">${esc(LB.name)}${LB.name === L.name
      ? ' <span class="chip i">本库</span>' : ' <span class="chip">跨库</span>'}</div>`
      + cs.map(c => `<div class="li add" data-addlib="${esc(LB.name)}" data-addclip="${esc(c.name)}">
          <span class="idx">+</span><span class="nm2">${esc(c.name)}</span>
          <span class="chip k${c.kind==='musetalk'?' m':' w'}">${KNAME[c.kind] || c.kind}</span>
          <span class="chip ${maeCls(c.tail_head_mae)}">首尾 ${maeTxt(c.tail_head_mae)}</span>
          <span class="chip">${c.frames} 帧</span></div>`).join('');
  }).join('');
  const candN = S.libs.filter(x => x.clip_count > 0).reduce((a, LB) => a
    + (LB.clips || []).filter(c => c.trained && (!chainKind || c.kind === chainKind)
        && !setName.has(LB.name + '/' + c.name)).length, 0);
  const itemsHTML = S.chainItems.length ? S.chainItems.map((it, i) => {
    const clipsHTML = it.clips.map((n, j) => {
      const c = clipMeta(it.lib, n) || {};
      return `<span class="cchip" title="${esc(n)} · ${c.frames || '?'} 帧">
        <b>${(i === 0 && j === 0) ? '入口' : (j + 1)}</b>${esc(n)}
        <span class="chip ${maeCls(c.tail_head_mae)}">${maeTxt(c.tail_head_mae)}</span>
        <i class="x" data-irm="${i}:${j}" title="移出本项">✕</i></span>`;
    }).join('');
    const LB2 = S.libs.find(x => x.name === it.lib) || {};
    const addOpts = ((LB2.clips) || []).filter(c => c.trained && !it.clips.includes(c.name))
      .map(c => `<option value="${esc(c.name)}">${esc(c.name)} · ${c.frames} 帧</option>`).join('');
    return `<div class="item">
      <div class="item-h">
        <span class="idx ${i === 0 ? 'entry' : ''}">项 ${i + 1}</span>
        <span class="libnm" title="${esc(it.lib)}">${esc(it.lib)}</span>
        <select class="sel sm" data-imode="${i}">
          ${modeOpts.map(([v, t]) => `<option value="${v}"${it.mode === v ? ' selected' : ''}>项内：${t}</option>`).join('')}
        </select>
        <label class="rn">重复<input type="number" min="1" max="999" value="${it.repeat}" data-irepeat="${i}">轮</label>
        <label class="rn">权重<input type="number" min="0" step="0.5" value="${it.weight}" data-iweight="${i}"></label>
        <span style="flex:1"></span>
        ${it.clips.length > 1 ? `<span class="act" data-isplit="${i}" title="拆成单项（每段各自成一项，可分别设参数）">⧉</span>` : ''}
        <span class="act" data-iup="${i}" title="上移">▲</span>
        <span class="act" data-idown="${i}" title="下移">▼</span>
        <span class="act del" data-idel="${i}" title="删除该项">✕</span>
      </div>
      <div class="clips">${clipsHTML}
        ${addOpts ? `<select class="sel sm addc" data-iadd="${i}">
          <option value="">＋ 加片段</option>${addOpts}</select>` : ''}
      </div></div>`;
  }).join('') : `<div style="padding:26px;text-align:center;color:#98a1b0;font-size:13px">
        还没有项。<br><span style="font-size:12px">从左边点片段加进来会自动按库建项；
        每个片段单独成项时，就能逐项设播放方式/重复/权重。</span></div>`;

  g.innerHTML = `
  <div class="panel" style="grid-column:1/-1">
    <div class="panel-h">
      <h3>${I.link} 素材链编排</h3>
      <span class="sub2">逐项配置：每项一个库，项内怎么轮 × 项间怎么走</span>
      <div class="spacer" style="flex:1"></div>
      <div class="sel-wrap"><select class="sel" id="chainLib">
        ${usables.map(x=>`<option value="${esc(x.name)}"${x.name===L.name?' selected':''}>${esc(x.name)}（${x.clip_count} 段）</option>`).join('')}
      </select></div>
      <div class="sel-wrap"><select class="sel" id="chainMode">
        <option value="shuffle"${S.chainMode==='shuffle'?' selected':''}>项之间：随机（等概率）</option>
        <option value="weight"${S.chainMode==='weight'?' selected':''}>项之间：随机 · 不重复</option>
        <option value="sequence"${S.chainMode==='sequence'?' selected':''}>项之间：顺序</option>
      </select></div>
      <button class="btn pri" id="chainSave">保存并实时生效</button>
      <button class="btn" id="chainVerify">校验接缝</button>
    </div>
    <div class="panel-b">
      <div class="note" style="margin-bottom:14px">${I.info}
        <div><b>项之间</b>：${outerHint[S.chainMode]}</div>
        <div style="margin-top:5px"><b>项内部</b>：由每一项自己的「项内」下拉决定；
          「重复」= 这一项播几轮再走；「权重」= 项间随机时被抽中的相对概率。</div>
      </div>
      ${kindTip}${mixedTip}
      <div class="chain2">
        <div class="col2">
          <div class="hd"><span>可用片段（可跨库）</span><span class="chip i">${candN} 个未入链</span></div>
          <div class="ls" id="avail">${candN ? candHTML
            : '<div style="padding:26px;text-align:center;color:#98a1b0;font-size:13px">'
              + (chainKind ? '同模型的片段都已经在右边了' : '还没有已训练的片段')
              + '</div>'}
          </div>
          <div class="ft">
            <button class="btn" id="chainAll">全部加入</button>
            <button class="btn" id="chainClear">清空</button>
          </div>
        </div>
        <div class="col2">
          <div class="hd"><span>项 · 播放顺序</span><span class="chip i">${itemCount} 项 · ${segCount} 段</span></div>
          <div class="ls" id="chain">${itemsHTML}</div>
          <div class="ft"><span class="hint" style="font-size:12px">
            项序 = 播放顺序；项内片段顺序 = 项内顺序；第一项第一段 = 入口</span></div>
        </div>
      </div>
      <div id="seamBox" style="margin-top:18px"></div>
    </div>
  </div>`;

  $('chainMode').onchange = e => { S.chainMode = e.target.value; renderChain(); };
  $('chainLib').onchange = e => { S.chainLib = e.target.value; S.chainItems = null; renderChain(); };
  // 项控制：上移/下移/删除【整项】、把片段移出本项
  $('chain').onclick = e => {
    const t = e.target, a = S.chainItems;
    const irm = t.getAttribute('data-irm'), iup = t.getAttribute('data-iup'),
          idn = t.getAttribute('data-idown'), idl = t.getAttribute('data-idel'),
          isp = t.getAttribute('data-isplit');
    if (isp != null){
      // 把「一项多段」拆成「每段一项」，继承同一份项内模式/重复/权重
      const i = +isp, it = a[i];
      const repl = it.clips.map(n => ({lib: it.lib, mode: it.mode, repeat: it.repeat,
                                       weight: it.weight, clips: [n]}));
      a.splice(i, 1, ...repl);
      renderChain(); return;
    }
    if (irm != null){
      const p = irm.split(':'), i = Number(p[0]), j = Number(p[1]);
      a[i].clips.splice(j, 1);
      if (!a[i].clips.length) a.splice(i, 1);      // 项空了就自动删项
      renderChain(); return;
    }
    if (iup != null){ const i = +iup; if (i > 0){ [a[i-1],a[i]]=[a[i],a[i-1]]; renderChain(); } return; }
    if (idn != null){ const i = +idn; if (i < a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; renderChain(); } return; }
    if (idl != null){ a.splice(+idl, 1); renderChain(); return; }
  };
  // 逐项参数：项内模式 / 重复次数 / 权重 / 项内加片段
  $('chain').onchange = e => {
    const t = e.target, a = S.chainItems;
    const im = t.getAttribute('data-imode'), ir = t.getAttribute('data-irepeat'),
          iw = t.getAttribute('data-iweight'), ia = t.getAttribute('data-iadd');
    if (im != null){ a[+im].mode = t.value; renderChain(); return; }
    if (ir != null){ a[+ir].repeat = Math.min(999, Math.max(1, parseInt(t.value, 10) || 1)); renderChain(); return; }
    if (iw != null){ a[+iw].weight = Math.max(0, Number(t.value) || 0); renderChain(); return; }
    if (ia != null && t.value){ addClipToLibItem(a[+ia].lib, t.value); renderChain(); return; }
  };
  // 左侧候选：点片段 → 加进它所属库的那一项（没有这一项就新建，追加在最后）
  $('avail').onclick = e => {
    const li = e.target.closest('[data-addclip]'); if (!li) return;
    addClipToLibItem(li.getAttribute('data-addlib'), li.getAttribute('data-addclip'));
    renderChain();
  };
  // 「全部加入」也遵守单模型约束：混着加进去保存会被服务端拒绝
  $('chainAll').onclick = () => {
    const kk = draftKind(S.chainItems);
    let added = 0, skipped = 0;
    S.libs.filter(x => x.clip_count > 0).forEach(LB => {
      (LB.clips || []).filter(c => c.trained).forEach(c => {
        if (kk && c.kind !== kk){ skipped++; return; }   // 不同模型：跳过
        addClipToLibItem(LB.name, c.name); added++;
      });
    });
    toast(`已加入 ${added} 个片段` + (skipped ? `，跳过 ${skipped} 个其他模型的片段（不能混编）` : ''), 4200);
    renderChain();
  };
  $('chainClear').onclick = () => { S.chainItems = []; renderChain(); };
  $('chainSave').onclick = async () => {
    const groups = itemsToGroups(S.chainItems);
    const segN = groups.reduce((a, g) => a + g.clips.length, 0);
    if (!segN){ toast('素材链至少要有一段', 2600, true); return; }
    const j = await jpost(`/api/libs/${q(L.name)}/playlist`, {groups, mode: S.chainMode});
    if (j.code !== 0){ toast('保存失败：' + j.msg, 5000, true); return; }
    const n = ((j.data||{}).reloaded_sessions||[]).length;
    toast(n ? `已保存（${groups.length} 项 / ${segN} 段），并实时生效到 ${n} 个正在运行的会话`
            : `已保存（${groups.length} 项 / ${segN} 段）· 当前无活跃会话，下次连接即生效`, 4600);
    await loadAll();
  };
  $('chainVerify').onclick = () => {
    // 直接用手上的 S.libs 元数据（已带 tail_head_mae / seam_from_prev_mae），不多打接口
    const flat = [];
    S.chainItems.forEach((it, ii) => it.clips.forEach((n, jj) =>
      flat.push({lib: it.lib, name: n, item: ii + 1, idx: jj + 1})));
    if (!flat.length){ toast('先往链里加片段，再校验接缝', 3000, true); return; }
    let worstAll = 0, rows = '';
    flat.forEach((o, i) => {
      const c = clipMeta(o.lib, o.name) || {};
      const v = c.tail_head_mae;
      // 接缝 MAE 是按【同库内相邻】算的；跨项/跨库的接缝没有实测数据 → 只在本项内非首段显示
      const sv = (o.idx > 1) ? c.seam_from_prev_mae : null;
      const w = Math.max(v == null ? 0 : v, sv == null ? 0 : sv);
      if (i > 0) worstAll = Math.max(worstAll, w);
      rows += `<tr>
        <td><span class="chip ${i===0?'i':''}">${i===0?'入口':'#'+(i+1)}</span></td>
        <td><span class="chip">项${o.item}.${o.idx}</span></td>
        <td style="font-weight:600">${esc(o.name)}
          <span style="color:#98a1b0;font-size:12px">${esc(o.lib)}</span></td>
        <td>${v==null?'—':`<span class="chip ${maeCls(v)}">${maeTxt(v)}</span>`}</td>
        <td>${sv==null?'<span style="color:#98a1b0">—</span>':`<span class="chip ${maeCls(sv)}">${maeTxt(sv)}</span>`}</td>
        <td>${v==null?'—':`<span class="chip ${maeCls(w)}">${maeWord(w)}</span>`}</td></tr>`;
    });
    $('seamBox').innerHTML = `<div class="panel" style="box-shadow:none">
      <div class="panel-h"><h3>接缝质量校验</h3>
        <span class="sub2">段内首尾差异 与 同项内上一段尾→本段头 的像素差（越小越无缝）</span>
        <div class="spacer" style="flex:1"></div>
        <span class="chip ${maeCls(worstAll)}">整条链最差 ${maeTxt(worstAll)} · ${maeWord(worstAll)}</span></div>
      <div class="panel-b" style="padding:0">
        <table class="tb"><thead><tr><th>#</th><th>位置</th><th>片段</th>
          <th>段内首尾差异</th><th>接缝（同项上一段）</th><th>结论</th></tr></thead>
          <tbody>${rows}</tbody></table>
        <div style="padding:14px 18px;border-top:1px solid var(--line-2)" class="hint">
          判定标准：<b>≤1.5 优秀</b>（几乎看不出切换）· <b>1.5~3 可接受</b> · <b>&gt;3 不可用</b>（会看到明显跳变）。<br>
          接缝一列只对「同一项内相邻的两段」有实测值（跨项/跨库的切换点是硬切，没有预计算值）。<br>
          想做到无缝，最稳的办法是让每段视频的<b>首帧和尾帧是同一张图</b>（生成工具里指定首尾帧）。
        </div>
      </div></div>`;
  };
}

/* ══════════════════════════════════════════════════════════════
   状态栏（并入面包屑右侧，无需单独状态栏）
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   数据加载
   ══════════════════════════════════════════════════════════════ */
async function loadAll(){
  let a, b, c;
  try {
    [a, b, c] = await Promise.all([
      jget('/api/libs'), jget('/api/libs/tasks'), jget('/api/materials/active')
    ]);
  } catch (e){
    // 服务在重启 / 网络瞬断：给出可读提示，并**保留当前界面**（不清空、不白屏）
    toast('读取素材库失败：' + (e && e.message ? e.message : '请求失败') +
          '（服务可能正在重启，稍后会自动恢复）', 6000, true);
    return false;
  }
  if (a && a.code === 0) S.libs = a.data.libs || [];
  else if (a) toast('读取素材库失败：' + a.msg, 5000, true);
  if (b && b.code === 0) S.tasks = b.data.tasks || [];
  if (c && c.code === 0) S.active = (c.data && c.data.active) || [];
  // 选中项清理：必须用「所有视图的全部条目」做存活判定。
  //   ⚠️ 原实现用 currentItems()（只含**当前视图**），于是在根视图选中几个库、
  //   再进入某个库之后，3 秒轮询就会把那些库的选中态悄悄删掉 —— 表现为
  //   "选了几个，过一会儿自己就没了"。
  const alive = new Set();
  for (const L of S.libs){
    alive.add('lib:' + L.name);
    alive.add('self:' + L.name);
    for (const c of (L.clips   || [])) alive.add('clip:'   + L.name + '/' + c.name);
    for (const u of (L.uploads || [])) alive.add('upload:' + L.name + '/' + u.file);
  }
  for (const t of S.tasks) alive.add('task:' + t.task_id);
  for (const k of [...S.sel]) if (!alive.has(k)) S.sel.delete(k);
  S.loaded = true;
  S._pollSig = pollTargetSig();
  renderAll();
  return true;
}
// paintSelection() 必须放在这里：S.sel 可能在别处被清空（如删除后），
// 只重绘内容区不会同步「批量操作条」，会留下「已选 N 项」的假状态。
function renderAll(){ renderSide(); renderCrumb(); renderContent(); paintSelection(); updateBtns(); }

/* 数据指纹：库名 + 片段名/帧数 + 上传名。只有它变了才需要重建侧栏 DOM。
   目的是让 3 秒轮询在「什么都没变」时完全不碰 DOM（消除闪烁）。 */
function pollTargetSig(){
  const parts = [];
  for (const L of S.libs){
    parts.push(L.name + '|' + (L.clip_count||0) + '|' + (L.uploads||[]).length);
    for (const c of (L.clips||[])) parts.push(c.name + ':' + c.frames + ':' + (c.trained?1:0));
    for (const u of (L.uploads||[])) parts.push('u' + u.file + (u.trained_as||''));
  }
  parts.push('tasks:' + S.tasks.map(t=>t.status).join(','));
  return parts.join(';');
}

/* 只更新「实时状态」的角标数字，不做整树重建 */
function updateActiveBadge(){
  const el = document.querySelector('[data-kind="active"] .cnt');
  if (!el) return;
  const n = (S.active||[]).length;
  const old = el.textContent;
  const txt = n ? String(n) : '无会话';
  if (old !== txt){ el.textContent = txt; el.classList.toggle('warn', !!n); }
}

/* 让结构没变时 loadAll 也能跳过重建（避免"保存后立刻闪一下"） */
function loadAllMaybeRender(){
  const sig = pollTargetSig();
  if (sig === S._pollSig){ updateActiveBadge(); return; }
  S._pollSig = sig;
  renderAll();
}

/* ══════════════════════════════════════════════════════════════
   选中
   ══════════════════════════════════════════════════════════════ */
/** 只切换某一项的选中态，**不动其它已选项**。
 *  这是"勾选多个"的核心：卡片右上角的 .chk 勾选框、以及多选模式下的普通点击都走它。
 */
function toggleOne(it){
  const k = keyOf(it);
  if (S.sel.has(k)) S.sel.delete(k); else S.sel.add(k);
  S.anchor = k;                    // 供 Shift 区间选择使用
  paintSelection(); updateBtns();
}

function selectItem(it, e){
  const k = keyOf(it);
  if (e.ctrlKey || e.metaKey){
    toggleOne(it); return;
  } else if (e.shiftKey && S.anchor){
    const items = viewItems();
    const a = items.findIndex(x => keyOf(x) === S.anchor);
    const b = items.findIndex(x => keyOf(x) === k);
    if (a >= 0 && b >= 0){
      S.sel.clear();
      for (let i=Math.min(a,b); i<=Math.max(a,b); i++) S.sel.add(keyOf(items[i]));
    } else { S.sel.clear(); S.sel.add(k); }
  } else {
    S.sel.clear(); S.sel.add(k); S.anchor = k;
  }
  // ⚠️ 不要在这里 renderContent()！
  //   renderContent() 会 g.innerHTML = ... 整片重建，所有 <img> 被销毁重建，
  //   浏览器必须重新解码 PNG → 用户看到"整个界面闪烁"。
  //   这里只需要改选中态的 class，不触碰 DOM 结构。
  paintSelection(); updateBtns();
}

/** 只更新选中态 class（不重建 DOM），避免缩略图闪烁。 */
function paintSelection(){
  const g = $('grid');
  if (!g) return;
  g.querySelectorAll('.card[data-key], .lrow[data-key], [data-key]').forEach(el => {
    const k = el.getAttribute('data-key');
    if (k) el.classList.toggle('sel', S.sel.has(k));
  });
  // 侧栏的选中态（保持同步）
  const s = $('side');
  if (s){
    s.querySelectorAll('.nitem[data-kind]').forEach(el => {
      const k = el.classList.contains('sub') ? null : null;
      // 侧栏项用它自己的 data-* 组合出 key（clip/upload/lib）
      const kind = el.getAttribute('data-kind');
      const lib = el.getAttribute('data-lib');
      const clip = el.getAttribute('data-clip');
      let key = null;
      if (kind === 'lib') key = 'lib:' + lib;
      else if (kind === 'clip') key = 'clip:' + lib + '/' + clip;
      else if (kind === 'upload') key = 'upload:' + lib + '/' + clip;
      if (key) el.classList.toggle('on', S.sel.has(key));
    });
  }
  updateSelCount();
}

/** 批量操作条的显隐与按钮可用性。 */
function updateSelCount(){
  const n = S.sel.size;
  const bar = $('selBar');
  const el = $('selCount');
  if (el) el.textContent = n ? `已选 ${n} 项` : '';
  if (bar) bar.style.display = n ? 'inline-flex' : 'none';
  if (!n) return;
  const sel = selList();
  const cl = sel.filter(x => x.kind === 'clip');
  const up = sel.filter(x => x.kind === 'upload');
  // 「编排素材链」：≥2 个片段，或者「只选 1 个库/单目录素材」（= 把整个文件夹入链）
  const bc = $('selChain');
  const folderOnly = !cl.length && sel.filter(x => x.kind === 'lib' || x.kind === 'self').length === 1;
  if (bc) bc.classList.toggle('dis', !(cl.length >= 2 || folderOnly));
  // 「一键训练」只对原始视频（未训练的）有意义
  const bt = $('selTrain');
  if (bt) bt.classList.toggle('dis', !up.some(u => !u.obj.trained_as));
}
function selList(){
  const out = [];
  for (const L of S.libs){
    if (S.sel.has('lib:'+L.name)) out.push({kind:'lib', lib:L.name, name:L.name, obj:L});
    if (S.sel.has('self:'+L.name)) out.push({kind:'self', lib:L.name, name:L.name, obj:L});
    for (const c of L.clips)   if (S.sel.has('clip:'+L.name+'/'+c.name)) out.push({kind:'clip', lib:L.name, name:c.name, obj:c});
    for (const u of L.uploads) if (S.sel.has('upload:'+L.name+'/'+u.file)) out.push({kind:'upload', lib:L.name, name:u.file, stem:u.stem, obj:u});
  }
  for (const t of S.tasks) if (S.sel.has('task:'+t.task_id)) out.push({kind:'task', name:t.task_id, obj:t});
  return out;
}
function updateBtns(){
  const hasLib = (S.cur.kind === 'lib' || S.cur.kind === 'clip');
  const n = selList().length;
  $('btnNewLib').disabled = false;
  $('btnUpload').disabled = !hasLib;
  $('btnMore').disabled = false;
}
function updateMoreMenu(){
  const hasLib = (S.cur.kind === 'lib' || S.cur.kind === 'clip');
  const sel = selList();
  const hasUntrained = hasLib && curLib() && curLib().uploads.some(u=>!u.trained_as);
  $('btnMore').disabled = false;
  const m = $('moreMenu');
  const can = sel.some(x=>x.kind==='upload');
  m.querySelector('[data-a="newclip"]').classList.toggle('dis', !hasLib);
  m.querySelector('[data-a="train"]').classList.toggle('dis', !(hasUntrained || can));
  m.querySelector('[data-a="chain"]').classList.toggle('dis', !S.libs.some(L=>L.clip_count>0));
  m.querySelector('[data-a="del"]').classList.toggle('dis', !sel.length);
}

/* ══════════════════════════════════════════════════════════════
   导航
   ══════════════════════════════════════════════════════════════ */
function hashOf(p){
  if (!p || p.kind === 'root') return '#/';
  if (p.kind === 'lib')  return '#/lib/' + encodeURIComponent(p.lib);
  if (p.kind === 'clip') return '#/lib/' + encodeURIComponent(p.lib) + '/' + encodeURIComponent(p.clip);
  return '#/' + p.kind;
}
function parseHash(){
  const h = String(location.hash||'').replace(/^#\/?/, '');
  if (!h) return {kind:'root'};
  const p = h.split('/').map(x => { try { return decodeURIComponent(x); } catch(e){ return x; } });
  if (p[0] === 'lib' && p[1])
    return p[2] ? {kind:'clip', lib:p[1], clip:p[2]} : {kind:'lib', lib:p[1]};
  if (['queue','chain','active'].includes(p[0])) return {kind:p[0]};
  return {kind:'root'};
}
function goTo(p, noHash){
  S.cur = Object.assign({kind:'root'}, p);
  if (p && p.lib) S.chainLib = p.lib;
  S.sel.clear(); S.anchor = null;
  if (!noHash){ const h = hashOf(S.cur); if (location.hash !== h) location.hash = h; }
  renderAll();
  $('content').scrollTop = 0;
}

/** 带"文本输入 + 单选"的对话框。
 *  opts: {title, sub, label, def, choices:[{v,label,desc}], choiceLabel, choiceDef, okText, onOk(name, choice)} */
function promptChoiceBox(opts){
  const choices = (opts.choices || []).map(c =>
    `<label class="opt${c.v === opts.choiceDef ? ' on' : ''}" data-v="${esc(c.v)}">
       <input type="radio" name="dlgOpt" value="${esc(c.v)}"${c.v === opts.choiceDef ? ' checked' : ''}>
       <span class="ot">${c.label}</span>
       ${c.desc ? `<span class="od">${c.desc}</span>` : ''}
     </label>`).join('');
  openDlg(`<h3>${esc(opts.title)}</h3>
    <div class="bd">
      ${opts.sub ? `<div class="hint" style="margin-bottom:10px">${opts.sub}</div>` : ''}
      <label class="lbl">${esc(opts.label)}</label>
      <input type="text" id="dlgIn" value="${esc(opts.def||'')}" autocomplete="off" spellcheck="false">
      ${choices ? `<label class="lbl" style="margin-top:14px">${esc(opts.choiceLabel||'类型')}</label>
        <div class="opts" id="dlgOpts">${choices}</div>` : ''}
      <div id="dlgErr" class="hint" style="color:#ef4444;display:none"></div>
    </div>
    <div class="ft"><button class="btn" id="dlgNo">取消</button>
      <button class="btn pri" id="dlgYes">${esc(opts.okText||'确定')}</button></div>`);
  const inp = $('dlgIn'); inp.focus(); inp.select();
  const optsEl = $('dlgOpts');
  if (optsEl){
    optsEl.onclick = e => {
      const l = e.target.closest('.opt'); if (!l) return;
      [...optsEl.children].forEach(x => x.classList.toggle('on', x === l));
      const r = l.querySelector('input'); if (r) r.checked = true;
    };
  }
  const getChoice = () => {
    const r = document.querySelector('input[name="dlgOpt"]:checked');
    return r ? r.value : (opts.choiceDef || '');
  };
  const ok = async () => {
    const v = inp.value.trim();
    if (!v){ const e = $('dlgErr'); e.textContent = '名称不能为空'; e.style.display='block'; return; }
    $('dlgNo').disabled = $('dlgYes').disabled = true;
    await opts.onOk(v, getChoice()); closeDlg();
  };
  $('dlgYes').onclick = ok;
  $('dlgNo').onclick = closeDlg;
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') closeDlg(); };
}

async function doTrain(){
  const lib = S.cur.lib;
  if (!lib){ toast('请先进入一个库', 3000, true); return; }
  const L = curLib();
  const sel = selList().filter(x=>x.kind==='upload');
  const n = sel.length || L.uploads.filter(u=>!u.trained_as).length;
  if (!n){ toast('这个库没有待训练的视频', 3200, true); return; }

  // 默认选中：库预设类型 > 该库已训出的类型 > wav2lip
  let defModel = L.default_model || '';
  if (!defModel){
    const tk = L.trained_kinds || [];
    defModel = tk.length === 1 ? tk[0] : 'wav2lip';
  }
  const scope = sel.length ? `选中的 ${sel.length} 个视频` : `全部 ${n} 个未训练视频`;
  trainModelBox('加入训练队列',
    `库：<b>${esc(lib)}</b><br>范围：<b>${scope}</b>` +
    (L.mixed ? `<div class="note" style="margin-top:10px;background:#fdf1de;color:#8d6417">
      <div>该库目前同时有 wav2lip 与 musetalk 片段。新训的片段会按上面选的类型生成，
      两者可以在库里共存，但<b>编排素材链时只能选同一类型</b>。</div></div>` : ''),
    defModel, async model => {
      const body = {model};
      if (sel.length) body.files = sel.map(x=>x.name);
      const j = await jpost(`/api/libs/${q(lib)}/train`, body);
      if (j.code !== 0){ toast('加入队列失败：' + j.msg, 5000, true); return; }
      toast(`已加入训练队列（${n} 个 · ${model}）`);
      await loadAll(); goTo({kind:'queue'});
    });
}
// 「编排素材链」入口 —— 支持两种选法：
//   ① 选中 ≥2 个片段 → 用这些片段作草稿（必须同一个库）
//   ② 只选中 1 个库（文件夹）→ 打开该库的链页面，并把库里**已训练片段全部预填**
//      （= 用户要的「文件夹直接选进去」）。库内混了多种模型时不预填：
//      混编会被服务端拒绝（一次只加载一种模型），留空让用户筛选后自己「全部加入」。
function doChain(){
  const sel = selList();
  const clips = sel.filter(x => x.kind === 'clip');
  const libs  = sel.filter(x => x.kind === 'lib' || x.kind === 'self');
  const openChain = (lib) => { S.chainLib = lib; goTo({kind:'chain', lib}); };

  if (libs.length > 1){
    toast('一条素材链只能属于一个库：请只选中一个库（或只选片段）', 4600, true); return;
  }

  // ② 文件夹（库）整体入链 → 「一项 = 一个库」
  if (!clips.length && libs.length === 1){
    const libName = libs[0].name;
    const L = S.libs.find(x => x.name === libName);
    const trained = ((L && L.clips) || []).filter(c => c.trained);
    S.chainDraftLib = libName;
    if (!trained.length){
      S.chainItems = [];
      openChain(libName);
      toast(`库「${libName}」还没有已训练好的片段 —— 请先上传视频并「一键训练」`, 5200, true);
      return;
    }
    const kinds = [...new Set(trained.map(c => c.kind))];
    if (kinds.length > 1){
      // 混模型库：先按数量最多的那种建一项（另一种请另建一条链），不让用户面对一个必然被拒的草稿
      const cnt = {};
      trained.forEach(c => { cnt[c.kind] = (cnt[c.kind] || 0) + 1; });
      const kk = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      S.chainItems = [{lib: libName, mode: 'sequence', repeat: 1, weight: 1,
                       clips: trained.filter(c => c.kind === kk).map(c => c.name)}];
      openChain(libName);
      toast(`库「${libName}」里混着两种模型：已先加入 ${kk} 的 ${cnt[kk]} 个片段`
            + `（${Object.keys(cnt).filter(k => k !== kk).join('/')} 请另建一条链）`, 6000, true);
      return;
    }
    S.chainItems = [{lib: libName, mode: 'sequence', repeat: 1, weight: 1,
                     clips: trained.map(c => c.name)}];
    openChain(libName);
    toast(`已把「${libName}」的 ${trained.length} 个片段做成 1 项（项内顺序）`
          + `· 可再设项内模式 / 重复轮数 / 权重`, 5000);
    return;
  }

  // ① 片段入链（同一库内 ≥2 个）→ **每个片段单独成一项**（这样才能逐项设参数）
  if (clips.length >= 2){
    const libset = [...new Set(clips.map(x => x.lib))];
    if (libset.length > 1){
      toast('请只选同一个库里的片段 —— 一条素材链只能属于一个库（跨库请进链页面用左边候选加）', 5000, true);
      return;
    }
    S.chainItems = clips.map(x => ({lib: libset[0], mode: 'sequence', repeat: 1, weight: 1,
                                    clips: [x.name]}));
    S.chainDraftLib = libset[0];
    openChain(libset[0]);
    toast(`已加入 ${clips.length} 个片段，每个单独成一项 —— 可逐项设「项内模式 / 重复 / 权重」`, 5000);
    return;
  }

  // 兜底：混选 / 只选 1 个片段 → 打开目标库的链页面（草稿留空，由它加载已保存的链）
  const useLib = (libs[0] && libs[0].name) || S.cur.lib || (S.libs[0] && S.libs[0].name);
  if (!useLib){ toast('还没有任何库 —— 先点右上角「新建库」', 4000, true); return; }
  S.chainItems = null;
  openChain(useLib);
}
function doDelete(){
  const sel = selList();
  if (!sel.length){ toast('请先选中要删除的项目', 2800, true); return; }
  const libs = sel.filter(x=>x.kind==='lib' || x.kind==='self');
  const clips = sel.filter(x=>x.kind==='clip');
  const ups = sel.filter(x=>x.kind==='upload');
  const list = sel.map(x=>`<span class="chip ${x.kind==='lib'||x.kind==='self'?'r':''}">${x.kind==='lib'?'库':(x.kind==='self'?'单目录素材':(x.kind==='clip'?'片段':'上传'))}</span> ${esc(x.lib?x.lib+' / '+x.name:x.name)}`).join('<br>');
  confirmBox('确认删除 ' + sel.length + ' 项？',
    `<div style="max-height:220px;overflow:auto;line-height:2.1;font-size:13px">${list}</div>` +
    (libs.length ? `<div class="note" style="margin-top:12px;background:#fdeceb;color:#b42318">
      <div><b>注意：</b>删除「库」或「单目录素材」会连同它里面<b>所有片段和上传文件</b>一起删掉，不可恢复。</div></div>` : ''),
    '删除', true, async () => {
      let ok = 0; const fail = [];
      for (const x of sel){
        let j;
        if (x.kind === 'lib')          j = await jpost(`/api/libs/${q(x.name)}`, null, 'DELETE');
        else if (x.kind === 'self')    j = await jpost(`/api/libs/${q(x.lib)}`, null, 'DELETE');
        else if (x.kind === 'clip')    j = await jpost(`/api/libs/${q(x.lib)}/clips/${q(x.name)}`, null, 'DELETE');
        else if (x.kind === 'upload')  j = await jpost(`/api/libs/${q(x.lib)}/upload/${q(x.name)}`, null, 'DELETE');
        else { fail.push(x.name + '（训练记录不能删）'); continue; }
        if (j && j.code === 0) ok++; else fail.push(x.name + '：' + ((j&&j.msg)||'失败'));
      }
      toast(fail.length ? `已删除 ${ok} 项，${fail.length} 项失败：${fail.join('；')}` : `已删除 ${ok} 项`,
        fail.length ? 7000 : 2800, !!fail.length);
      S.sel.clear();
      await loadAll();
      // 删掉的正是当前打开的库 → 必须退回根视图。
      // 否则 S.cur 仍指向已不存在的路径：curLib() 返回 undefined、内容区空白、面包屑残留死名字。
      const gone = new Set(sel.filter(x => x.kind === 'lib' || x.kind === 'self').map(x => x.name));
      if (S.cur.lib && gone.has(S.cur.lib)) goTo({kind:'root'});
    });
}

function showCtx(x, y, items){
  const el = $('ctx');
  el.innerHTML = items.map((it,i) => it.hr ? '<div class="hr"></div>'
    : `<div class="it${it.dis?' dis':''}" data-i="${i}">${it.l}</div>`).join('');
  el.classList.add('on');
  el.style.left = Math.min(x, innerWidth - el.offsetWidth - 10) + 'px';
  el.style.top  = Math.min(y, innerHeight - el.offsetHeight - 10) + 'px';
  el.onclick = e => {
    const d = e.target.closest('.it'); if (!d) return;
    const it = items[+d.getAttribute('data-i')]; hideCtx();
    if (!it.dis && it.f) it.f();
  };
}
function hideCtx(){ $('ctx').classList.remove('on'); }

/* ══════════════════════════════════════════════════════════════
   事件绑定
   ══════════════════════════════════════════════════════════════ */
function bind(){
  // 顶部
  $('btnNewLib').onclick = newLib;
  $('btnUpload').onclick = doUpload;
  $('btnMore').onclick = e => { e.stopPropagation(); updateMoreMenu(); $('moreMenu').classList.toggle('on'); };
  $('moreMenu').onclick = e => {
    const mi = e.target.closest('.mi'); if (!mi || mi.classList.contains('dis')) return;
    $('moreMenu').classList.remove('on');
    const a = mi.getAttribute('data-a');
    if (a === 'newclip') newClip();
    else if (a === 'train') doTrain();
    else if (a === 'chain') doChain();
    else if (a === 'del') doDelete();
    else if (a === 'refresh') loadAll();
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrap')) $('moreMenu').classList.remove('on');
    hideCtx();
  });
  // 批量操作条：动作全部复用已有函数，避免两套逻辑各自演化
  if ($('selClear')) $('selClear').onclick = () => { S.sel.clear(); S.anchor = null; paintSelection(); updateBtns(); };
  if ($('selDel'))   $('selDel').onclick   = () => doDelete();
  if ($('selChain')) $('selChain').onclick = () => doChain();   // 内部处理「文件夹整体入链」与各提示
  if ($('selTrain')) $('selTrain').onclick = async () => {
    const ups = selList().filter(x => x.kind === 'upload' && !x.obj.trained_as);
    if (!ups.length){ toast('勾选的内容里没有「待训练」的原始视频', 3200, true); return; }
    // 勾选可能跨库，所以要按库分组提交（训练接口是「库 + 文件列表」）
    const byLib = {};
    for (const u of ups) (byLib[u.lib] = byLib[u.lib] || []).push(u.name);
    const libs = Object.keys(byLib);
    const def = (curLib() && curLib().default_model)
      || ((S.libs.find(x => x.name === libs[0]) || {}).default_model) || 'wav2lip';
    trainModelBox('加入训练队列',
      `已勾选 <b>${ups.length}</b> 个原始视频` +
      (libs.length > 1 ? `（分布在 ${libs.length} 个库）` : `，库：<b>${esc(libs[0])}</b>`) +
      `<div class="note" style="margin-top:10px">训练是<b>串行队列</b>：一个完成再跑下一个。</div>`,
      def, async model => {
        let okn = 0;
        for (const [lib, files] of Object.entries(byLib)){
          const j = await jpost(`/api/libs/${q(lib)}/train`, { files, model });
          if (j.code === 0) okn += files.length;
          else toast('提交失败：' + j.msg, 5000, true);
        }
        if (okn){ toast(`${okn} 个视频已加入训练队列（${model}）`); await loadAll(); goTo({kind:'queue'}); }
      });
  };

  $('selCount').onclick = () => { S.sel.clear(); S.anchor = null; paintSelection(); updateBtns(); };

  // 搜索
  const se = $('search');
  se.addEventListener('input', () => {
    S.q = se.value;
    $('searchWrap').classList.toggle('has', !!se.value);
    renderContent(); renderCrumb(); renderSide();
  });
  $('searchClr').onclick = () => { se.value=''; S.q=''; $('searchWrap').classList.remove('has'); renderContent(); renderCrumb(); renderSide(); se.focus(); };
  $('sortBy').onchange = e => { S.sort = e.target.value; renderContent(); };
  $('kindBy').onchange = e => { S.kind = e.target.value; S.sel.clear(); renderContent(); renderCrumb(); renderSide(); };
  $('showDone').onchange = e => { S.showDone = e.target.checked; renderContent(); renderCrumb(); renderSide(); };
  $('viewSeg').onclick = e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    S.view = b.getAttribute('data-v');
    [...$('viewSeg').children].forEach(x => x.classList.toggle('on', x === b));
    renderContent();
  };
  $('mask').onclick = e => { if (e.target.id === 'mask') closeDlg(); };

  // 侧边栏
  $('side').onclick = e => {
    // 悬停操作按钮（重命名 / 删除）—— 必须优先于行的跳转处理
    const opEl = e.target.closest('[data-op]');
    if (opEl){
      e.preventDefault(); e.stopPropagation();
      const op = opEl.getAttribute('data-op');
      const lib = opEl.getAttribute('data-lib');
      if (op === 'ren-lib') renameLib(lib);
      else if (op === 'del-lib') delLib(lib);
      else if (op === 'ren-clip') renameClip(lib, opEl.getAttribute('data-clip'));
      else if (op === 'del-clip') delClip(lib, opEl.getAttribute('data-clip'));
      else if (op === 'ren-up') renameUpload(lib, opEl.getAttribute('data-file'));
      else if (op === 'del-up') delUpload(lib, opEl.getAttribute('data-file'));
      return;
    }
    const tw = e.target.closest('[data-tw]');
    if (tw){
      const n = tw.getAttribute('data-tw');
      S.expanded.has(n) ? S.expanded.delete(n) : S.expanded.add(n);
      renderSide(); return;
    }
    const r = e.target.closest('.nitem'); if (!r) return;
    const k = r.getAttribute('data-kind');
    // 单击 = 只选中（Windows 资源管理器习惯：选中不等于打开）
    // 双击 = 打开/进入（由下面的 ondblclick 处理）
    // 注意：库行单击不导航，避免"想选中却跳走了"；进入靠双击或展开箭头。
    if (k === 'clip' || k === 'upload' || k === 'lib' || k === 'self' || k === 'root'){
      // 侧栏选中态与内容区选中态统一走 S.sel，保证"删除/编排"能拿到选择
      const lib = r.getAttribute('data-lib');
      const clip = r.getAttribute('data-clip');
      let key = null;
      if (k === 'lib')         key = 'lib:' + lib;
      else if (k === 'clip')   key = 'clip:' + lib + '/' + clip;
      else if (k === 'upload') key = 'upload:' + lib + '/' + clip;
      if (key){
        S.sel.clear(); S.sel.add(key); S.anchor = key;
        paintSelection();
      }
      return;
    }
    if (k) goTo({kind:k});
  };

  // 双击进入（Windows 习惯：素材 = 打开，库 = 进入）
  $('side').ondblclick = e => {
    if (e.target.closest('[data-op]')) return;
    const r = e.target.closest('.nitem'); if (!r) return;
    const k = r.getAttribute('data-kind');
    const lib = r.getAttribute('data-lib'), clip = r.getAttribute('data-clip');
    if (k === 'lib'){ S.expanded.add(lib); goTo({kind:'lib', lib}); }
    else if (k === 'clip'){ goTo({kind:'clip', lib, clip}); }
    else if (k === 'upload'){
      const L = S.libs.find(x => x.name === lib);
      const u = ((L && L.uploads) || []).find(x => x.file === clip || x.stem === clip);
      if (u && u.trained_as) goTo({kind:'clip', lib, clip:u.trained_as});
      else toast('这个视频还没训练 —— 先选中它然后点「更多 → 一键训练」', 3600, true);
    }
    else if (k === 'self'){ goTo({kind:'lib', lib}); }
    else if (k) goTo({kind:k});
  };
  // 面包屑
  $('crumb').onclick = e => {
    const s = e.target.closest('.seg2'); if (!s) return;
    const k = s.getAttribute('data-kind'), lib = s.getAttribute('data-lib'), clip = s.getAttribute('data-clip');
    if (k === 'root') goTo({kind:'root'});
    else if (k === 'clip') goTo({kind:'clip', lib, clip});
    else if (k === 'lib') goTo({kind:'lib', lib});
    else goTo({kind:k});
  };

  // 内容区
  const c = $('content');
  c.addEventListener('click', e => {
    if (e.target.closest('.qb')) return;
    const card = e.target.closest('.card, .lrow');
    if (!card || S.cur.kind === 'chain' || S.cur.kind === 'active') return;
    const kind = card.getAttribute('data-kind'), name = card.getAttribute('data-name'),
          lib = card.getAttribute('data-lib');
    const it = viewItems().find(x => x.kind===kind && x.name===name && (!lib || x.lib===lib));
    if (!it) return;
    // 点勾选框 = 只切换这一项（可连续勾选多个）；点卡片其它位置 = 单选。
    // 之前 .chk 只是个没有事件处理的 span，点击会落到下面走单选分支，
    // 每次都 S.sel.clear() —— 所以"勾第二个就把第一个取消掉了"。
    if (e.target.closest('.chk')){ toggleOne(it); return; }
    selectItem(it, e);
  });
  c.addEventListener('dblclick', e => {
    const card = e.target.closest('.card, .lrow'); if (!card) return;
    const kind = card.getAttribute('data-kind'), name = card.getAttribute('data-name'),
          lib = card.getAttribute('data-lib');
    if (kind === 'lib') goTo({kind:'lib', lib:name});
    else if (kind === 'clip') previewClip(lib, name);
    else if (kind === 'self') previewSelf(lib);
    else if (kind === 'upload'){
      const L = S.libs.find(x=>x.name===lib);
      const u = (L && L.uploads || []).find(x=>x.file===name);
      if (u && u.trained_as) goTo({kind:'clip', lib, clip:u.trained_as});
      else toast('这个视频还没训练 —— 先用「更多 → 一键训练」', 3400, true);
    }
  });
  c.addEventListener('contextmenu', e => {
    const card = e.target.closest('.card, .lrow');
    e.preventDefault(); hideCtx();
    if (!card) return;
    const kind = card.getAttribute('data-kind'), name = card.getAttribute('data-name'),
          lib = card.getAttribute('data-lib');
    const found = viewItems().find(x => x.kind===kind && x.name===name && (!lib || x.lib===lib));
    if (!found) return;
    if (!S.sel.has(keyOf(found))){ S.sel.clear(); S.sel.add(keyOf(found)); paintSelection(); updateBtns(); }
    const selClips = selList().filter(x=>x.kind==='clip');
    const items = [];
    if (kind === 'lib'){
      items.push({l:'打开', f:()=>goTo({kind:'lib', lib:name})});
      items.push({l:'重命名库…', f:()=>renameLib(name)});
      items.push({l:'复制角色 ID', f:()=>copyId(name)});
    }
    if (kind === 'self'){
      items.push({l:'预览', f:()=>previewSelf(lib)});
      items.push({l:'复制角色 ID', f:()=>copyId(lib)});
    }
    if (kind === 'clip'){
      items.push({l:'预览首尾帧', f:()=>previewClip(lib, name)});
      items.push({l:'重命名片段…', f:()=>renameClip(lib, name)});
      if (S.libs.length > 1) items.push({l:'移动到其他库…', f:()=>moveClip(lib, name)});
      items.push({l:'查看所属库', f:()=>goTo({kind:'lib', lib})});
      items.push({hr:true});
      items.push({l:selClips.length>=2 ? `用选中的 ${selClips.length} 段编排素材链` : '编排素材链',
        f:()=>{ if (selClips.length>=2){ S.chainItems = selClips.map(x=>({lib, mode:'sequence', repeat:1, weight:1, clips:[x.name]})); S.chainDraftLib=lib; } goTo({kind:'chain', lib}); }});
    }
    if (kind === 'upload'){
      items.push({l:'训练这个视频', f:()=>trainOne(lib, name)});
      items.push({l:'重命名文件…', f:()=>renameUpload(lib, name)});
    }
    items.push({hr:true});
    items.push({l: selList().length>1 ? `删除选中的 ${selList().length} 项` : '删除', f:doDelete});
    items.push({l:'重新扫描', f:()=>loadAll()});
    showCtx(e.clientX, e.clientY, items);
  });

  // 键盘
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ hideCtx(); closeDlg(); $('moreMenu').classList.remove('on'); }
    if (e.key === 'F5'){ e.preventDefault(); loadAll(); }
    if (e.key === 'Delete' && S.sel.size) doDelete();
    if (e.ctrlKey && e.key.toLowerCase() === 'a'){
      if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
      e.preventDefault();
      S.sel.clear(); viewItems().forEach(x => S.sel.add(keyOf(x)));
      paintSelection(); updateBtns();
    }
  });

  // 拖拽上传
  let dn = 0;
  const canDrop = () => S.cur.kind === 'lib' || S.cur.kind === 'clip';
  document.addEventListener('dragenter', e => {
    if (!canDrop()) return;
    e.preventDefault(); dn++; document.body.classList.add('dragging');
    $('dragTarget').textContent = '上传到「' + S.cur.lib + '」';
  });
  document.addEventListener('dragover', e => { if (canDrop()) e.preventDefault(); });
  document.addEventListener('dragleave', e => {
    if (--dn <= 0){ dn = 0; document.body.classList.remove('dragging'); }
  });
  document.addEventListener('drop', e => {
    e.preventDefault(); dn = 0; document.body.classList.remove('dragging');
    if (!canDrop()){ toast('请先进入一个库再拖入视频', 3200, true); return; }
    uploadFiles(S.cur.lib, e.dataTransfer.files);
  });
  window.addEventListener('hashchange', () => {
    S.cur = parseHash();
    if (S.cur.lib) S.chainLib = S.cur.lib;
    S.sel.clear(); S.anchor = null;
    renderAll();
  });
}

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */
(async function init(){
  bind();
  const qs = new URLSearchParams(location.search);
  if (qs.get('view') === 'list'){
    S.view = 'list';
    [...$('viewSeg').children].forEach(x => x.classList.toggle('on', x.getAttribute('data-v') === 'list'));
  }
  if (qs.get('sort') === 'frames' || qs.get('sort') === 'name' || qs.get('sort') === 'name_d' || qs.get('sort') === 'mae'){
    S.sort = qs.get('sort'); $('sortBy').value = S.sort;
  }
  if (qs.get('q')){ S.q = qs.get('q'); $('search').value = S.q; $('searchWrap').classList.add('has'); }

  renderContent();                     // 先出骨架屏
  await loadAll();
  S.cur = parseHash();
  if (S.cur.lib) S.chainLib = S.cur.lib;
  if (S.libs.length && !S.expanded.size) S.expanded.add(S.libs[0].name);
  renderAll();

  // 轮询：只刷新「会变的东西」，不再整页重建 DOM。
  //
  // 之前的写法在训练中（busy）每 3 秒调一次 loadAll() → renderAll()，
  // 把侧栏与内容区的 innerHTML 全部重建一遍 —— 所有 <img> 被销毁重建，
  // 浏览器要重新解码/重绘缩略图，于是整个页面「闪烁得很厉害」。
  // 现在拆开：侧栏/内容区只在数据指纹变化时才重建；否则只做局部增量更新。
  setInterval(async () => {
    let b, c;
    try {
      [b, c] = await Promise.all([jget('/api/libs/tasks'), jget('/api/materials/active')]);
    } catch (e){
      return;   // 网络抖动/服务重启时静默跳过本轮，不要弹错误、不要清空界面
    }
    if (b && b.code === 0) S.tasks = b.data.tasks || [];
    if (c && c.code === 0) S.active = (c.data && c.data.active) || [];

    const busy = S.tasks.some(t => t.status==='running' || t.status==='pending');
    if (busy) await loadAll();
    const tgt = pollTargetSig();
    if (tgt !== S._pollSig){          // 只有「库/片段结构」真的变了才重建
      S._pollSig = tgt;
      renderSide(); renderCrumb();
    }
    if (S.cur.kind === 'queue') renderQueuePanel();
    if (S.cur.kind === 'active') renderActive();
    updateActiveBadge();
  }, 3000);
})();
</script>
